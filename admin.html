<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ओवी पोर्टल - एडमिन पैनल</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBSiDAvDYyBG8hkmez7s900JHhlbenG2nU",
            authDomain: "oaps-d2cce.firebaseapp.com",
            projectId: "oaps-d2cce",
            storageBucket: "oaps-d2cce.firebasestorage.app",
            messagingSenderId: "619616461386",
            appId: "1:619616461386:web:c3b9b36815369c6f5d7cb3",
            measurementId: "G-5Y6RHLE2LK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_EMAIL = "hkosiun1221@gmail.com";

        onAuthStateChanged(auth, async (user) => {
            if (!user || user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
                alert('अथॉरिटी नहीं है! केवल एडमिन ही इस पेज को खोल सकता है।');
                window.location.href = "index.html";
            } else {
                document.getElementById('adminEmailDisplay').innerText = user.email;
            }
        });

        window.handleLogout = async function() {
            await signOut(auth);
            window.location.href = "index.html";
        };

        window.createNewUserByAdmin = async function(event) {
            event.preventDefault();
            const newUserEmail = document.getElementById('newAdminUserEmail').value.trim().toLowerCase();
            const newUserPass = document.getElementById('newAdminUserPass').value.trim();
            const initialCredits = parseInt(document.getElementById('newAdminUserCredits').value) || 10;
            const isVip = document.getElementById('newAdminUserVip').checked;
            const msg = document.getElementById('adminCreateMsg');
            msg.classList.remove('hidden');
            msg.innerText = "यूजर बनाया जा रहा है...";

            try {
                const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${firebaseConfig.apiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: newUserEmail, password: newUserPass, returnSecureToken: true })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error.message);

                await setDoc(doc(db, "users", data.localId), {
                    email: newUserEmail, username: newUserEmail.split('@')[0], credits: initialCredits, isVip: isVip, createdAt: new Date()
                });
                msg.className = "mt-2 text-xs text-green-600 font-bold";
                msg.innerText = `सफलता! ${newUserEmail} बन गया है (VIP: ${isVip ? 'हाँ' : 'ना'})`;
                document.getElementById('adminCreateUserForm').reset();
            } catch(err) {
                msg.className = "mt-2 text-xs text-red-600 font-bold";
                msg.innerText = "एरर: " + err.message;
            }
        };

        window.addCreditsOrToggleVip = async function(event) {
            event.preventDefault();
            const queryEmail = document.getElementById('targetUser').value.trim().toLowerCase();
            const addCreds = parseInt(document.getElementById('creditsToAdd').value) || 0;
            const makeVip = document.getElementById('toggleVipStatus').checked;
            const msg = document.getElementById('adminMsg');
            msg.classList.remove('hidden');
            msg.innerText = "अपडेट हो रहा है...";

            try {
                const q = query(collection(db, "users"), where("email", "==", queryEmail));
                const snap = await getDocs(q);
                if(snap.empty) {
                    msg.innerText = "यूजर नहीं मिला!";
                    return;
                }
                let uId, curCreds = 0;
                snap.forEach(d => { uId = d.id; curCreds = d.data().credits || 0; });

                await updateDoc(doc(db, "users", uId), {
                    credits: curCreds + addCreds,
                    isVip: makeVip
                });
                msg.className = "mt-2 text-xs text-green-600 font-bold";
                msg.innerText = `सफलता! नए क्रेडिट्स: ${curCreds + addCreds}, VIP स्टेटस: ${makeVip ? 'एक्टिव' : 'हटाया गया'}`;
            } catch(err) {
                msg.className = "mt-2 text-xs text-red-600 font-bold";
                msg.innerText = "एरर: " + err.message;
            }
        };
    </script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between">
    <header class="bg-white shadow-sm border-b px-6 py-4 flex justify-between items-center">
        <div><h2 class="text-xl font-bold text-slate-800"><i class="fa-solid fa-shield-halved text-amber-600 mr-2"></i> एडमिन कंट्रोल पैनल</h2><p class="text-xs text-slate-500">लॉगिन: <span id="adminEmailDisplay" class="font-semibold text-amber-700"></span></p></div>
        <div class="flex items-center space-x-3">
            <a href="index.html" class="bg-blue-50 text-blue-700 border border-blue-200 px-3 py-1.5 rounded-lg text-xs font-semibold"><i class="fa-solid fa-house mr-1"></i> मुख्य पोर्टल पर जाएं</a>
            <button onclick="window.handleLogout()" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg text-xs font-semibold">लॉगआउट</button>
        </div>
    </header>
    <main class="max-w-3xl mx-auto w-full p-6 space-y-6 flex-grow">
        <div class="bg-amber-50 border border-amber-200 rounded-2xl p-5 shadow-sm">
            <h3 class="text-md font-bold text-amber-800 mb-3">👤 नया यूजर या VIP अकाउंट बनाएँ</h3>
            <form onsubmit="window.createNewUserByAdmin(event)" class="space-y-3">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <input type="email" id="newAdminUserEmail" placeholder="यूजर ईमेल" required class="p-2 border rounded-lg text-sm bg-white">
                    <input type="password" id="newAdminUserPass" placeholder="पासवर्ड (कम से कम 6 अंक)" required minlength="6" class="p-2 border rounded-lg text-sm bg-white">
                    <input type="number" id="newAdminUserCredits" placeholder="शुरुआती क्रेडिट" required class="p-2 border rounded-lg text-sm bg-white">
                </div>
                <div class="flex items-center space-x-2 pt-1">
                    <input type="checkbox" id="newAdminUserVip" class="w-4 h-4 text-purple-600 rounded">
                    <label for="newAdminUserVip" class="text-xs font-semibold text-slate-700">इस यूजर को VIP अधिकार दें (Annexure & Affidavits के लिए)</label>
                </div>
                <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-semibold py-2.5 rounded-lg text-sm shadow">यूजर रजिस्टर करें</button>
            </form>
            <div id="adminCreateMsg" class="mt-2 text-xs hidden"></div>
        </div>

        <div class="bg-blue-50 border border-blue-200 rounded-2xl p-5 shadow-sm">
            <h3 class="text-md font-bold text-blue-800 mb-3">💰 क्रेडिट जोड़ें या VIP स्टेटस बदलें</h3>
            <form onsubmit="window.addCreditsOrToggleVip(event)" class="space-y-3">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <input type="text" id="targetUser" placeholder="यूजर ईमेल" required class="p-2 border rounded-lg text-sm bg-white">
                    <input type="number" id="creditsToAdd" placeholder="जोड़ने वाले क्रेडिट्स (जैसे 5 या 10)" required class="p-2 border rounded-lg text-sm bg-white">
                </div>
                <div class="flex items-center space-x-2 pt-1">
                    <input type="checkbox" id="toggleVipStatus" class="w-4 h-4 text-purple-600 rounded">
                    <label for="toggleVipStatus" class="text-xs font-semibold text-slate-700">VIP एक्सेस एनेबल करें</label>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm shadow">अपडेट करें</button>
            </form>
            <div id="adminMsg" class="mt-2 text-xs hidden"></div>
        </div>
    </main>
    <footer class="bg-white border-t text-center py-4 text-xs text-slate-500">© 2026 ओवी आधार प्रिंट सर्विस - एडमिन पैनल</footer>
</body>
</html>
