<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ओवी पोर्टल - एडमिन पैनल</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBSiDAvDYyBG8hkmez7s900JHhlbenG2nU",
            authDomain: "oaps-d2cce.firebaseapp.com",
            projectId: "oaps-d2cce",
            storageBucket: "oaps-d2cce.firebasestorage.app",
            messagingSenderId: "619616461386",
            appId: "1:619616461386:web:c3b9b36815369c6f5d7cb3",
            measurementId: "G-5Y6RHLE2LK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_EMAIL = "hkosiun1221@gmail.com";

        onAuthStateChanged(auth, async (user) => {
            if (!user || user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
                alert('अथॉरिटी नहीं है! केवल एडमिन ही इस पेज को खोल सकता है।');
                window.location.href = "index.html";
            } else {
                document.getElementById('adminEmailDisplay').innerText = user.email;
                document.getElementById('adminPanelContent').classList.remove('hidden');
            }
        });

        window.handleLogout = async function() {
            await signOut(auth);
            window.location.href = "index.html";
        };

        window.createNewUserByAdmin = async function(event) {
            event.preventDefault();
            const newUserEmail = document.getElementById('newAdminUserEmail').value.trim().toLowerCase();
            const newUserPass = document.getElementById('newAdminUserPass').value.trim();
            const initialCredits = parseInt(document.getElementById('newAdminUserCredits').value) || 10;
            const isVip = document.getElementById('newAdminUserVip').checked;
            
            const msg = document.getElementById('adminCreateMsg');
            const btn = event.target.querySelector('button[type="submit"]');
            btn.disabled = true; btn.innerText = "बनाया जा रहा है...";
            msg.classList.remove('hidden'); msg.innerText = "नया यूजर रजिस्टर हो रहा है...";

            try {
                // Firebase REST API to create user safely without logging admin out
                const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${firebaseConfig.apiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: newUserEmail, password: newUserPass, returnSecureToken: true })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error.message);

                await setDoc(doc(db, "users", data.localId), {
                    email: newUserEmail, 
                    username: newUserEmail.split('@')[0], 
                    credits: initialCredits, 
                    isVip: isVip, 
                    createdAt: new Date()
                });
                
                msg.className = "mt-3 p-2 bg-green-100 text-green-700 rounded-lg text-sm font-bold border border-green-300";
                msg.innerHTML = `<i class="fa-solid fa-check-circle mr-1"></i> सफलता! नया यूजर (${newUserEmail}) बन गया है।`;
                event.target.reset();
            } catch(err) {
                msg.className = "mt-3 p-2 bg-red-100 text-red-700 rounded-lg text-sm font-bold border border-red-300";
                msg.innerHTML = `<i class="fa-solid fa-circle-xmark mr-1"></i> एरर: ${err.message}`;
            } finally {
                btn.disabled = false; btn.innerText = "यूजर रजिस्टर करें";
            }
        };

        window.addCreditsOrToggleVip = async function(event) {
            event.preventDefault();
            const queryEmail = document.getElementById('targetUser').value.trim().toLowerCase();
            const addCreds = parseInt(document.getElementById('creditsToAdd').value) || 0;
            const makeVip = document.getElementById('toggleVipStatus').checked;
            
            const msg = document.getElementById('adminMsg');
            const btn = event.target.querySelector('button[type="submit"]');
            btn.disabled = true; btn.innerText = "अपडेट हो रहा है...";
            msg.classList.remove('hidden'); msg.innerText = "डेटाबेस में यूजर ढूंढा जा रहा है...";

            try {
                const q = query(collection(db, "users"), where("email", "==", queryEmail));
                const snap = await getDocs(q);
                
                if(snap.empty) {
                    throw new Error("यह ईमेल डेटाबेस में नहीं मिला! कृपया सही ईमेल दर्ज करें।");
                }
                
                let uId, curCreds = 0;
                snap.forEach(d => { uId = d.id; curCreds = d.data().credits || 0; });

                const totalCredits = curCreds + addCreds;

                await updateDoc(doc(db, "users", uId), {
                    credits: totalCredits,
                    isVip: makeVip
                });
                
                msg.className = "mt-3 p-2 bg-green-100 text-green-700 rounded-lg text-sm font-bold border border-green-300";
                msg.innerHTML = `<i class="fa-solid fa-check-circle mr-1"></i> सफलता! यूजर के नए क्रेडिट्स: ${totalCredits} | VIP: ${makeVip ? 'हाँ' : 'ना'}`;
                event.target.reset();
            } catch(err) {
                msg.className = "mt-3 p-2 bg-red-100 text-red-700 rounded-lg text-sm font-bold border border-red-300";
                msg.innerHTML = `<i class="fa-solid fa-circle-xmark mr-1"></i> एरर: ${err.message}`;
            } finally {
                btn.disabled = false; btn.innerText = "अपडेट करें";
            }
        };
    </script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">
    <header class="bg-white shadow-sm border-b px-6 py-4 flex justify-between items-center">
        <div>
            <h2 class="text-xl font-bold text-slate-800"><i class="fa-solid fa-shield-halved text-amber-600 mr-2"></i> सुपर एडमिन पैनल</h2>
            <p class="text-xs text-slate-500 font-medium mt-1">लॉगिन: <span id="adminEmailDisplay" class="font-bold text-amber-700">चेक किया जा रहा है...</span></p>
        </div>
        <div class="flex items-center space-x-3">
            <a href="index.html" class="bg-slate-100 text-slate-700 border border-slate-300 px-3 py-2 rounded-lg text-xs font-bold hover:bg-slate-200 transition shadow-sm"><i class="fa-solid fa-house mr-1"></i> पोर्टल पर जाएं</a>
            <button onclick="window.handleLogout()" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-2 rounded-lg text-xs font-bold transition shadow-sm border border-red-200"><i class="fa-solid fa-power-off mr-1"></i> लॉगआउट</button>
        </div>
    </header>

    <!-- Content is hidden until Admin is verified -->
    <main id="adminPanelContent" class="max-w-4xl mx-auto w-full p-4 md:p-6 space-y-6 flex-grow hidden">
        
        <!-- Create User Section -->
        <div class="bg-white border-t-4 border-amber-500 rounded-2xl p-6 shadow-md">
            <h3 class="text-lg font-bold text-slate-800 mb-4"><i class="fa-solid fa-user-plus text-amber-500 mr-2"></i> नया यूजर बनाएँ</h3>
            <form id="adminCreateUserForm" onsubmit="window.createNewUserByAdmin(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">यूजर ईमेल</label>
                        <input type="email" id="newAdminUserEmail" placeholder="user@gmail.com" required class="w-full p-3 border border-slate-300 rounded-xl text-sm bg-slate-50 focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">पासवर्ड</label>
                        <input type="password" id="newAdminUserPass" placeholder="कम से कम 6 अंक" required minlength="6" class="w-full p-3 border border-slate-300 rounded-xl text-sm bg-slate-50 focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">शुरुआती क्रेडिट्स</label>
                        <input type="number" id="newAdminUserCredits" placeholder="जैसे: 10" required class="w-full p-3 border border-slate-300 rounded-xl text-sm bg-slate-50 focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>
                </div>
                <div class="flex items-center space-x-2 pt-2 bg-amber-50 p-3 rounded-lg border border-amber-100">
                    <input type="checkbox" id="newAdminUserVip" class="w-5 h-5 text-amber-600 rounded">
                    <label for="newAdminUserVip" class="text-sm font-bold text-amber-900 cursor-pointer">इस यूजर को VIP अधिकार (VIP Access) दें</label>
                </div>
                <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-xl text-sm shadow-lg shadow-amber-200 transition">यूजर रजिस्टर करें</button>
            </form>
            <div id="adminCreateMsg" class="hidden"></div>
        </div>

        <!-- Add Credits Section -->
        <div class="bg-white border-t-4 border-blue-500 rounded-2xl p-6 shadow-md">
            <h3 class="text-lg font-bold text-slate-800 mb-4"><i class="fa-solid fa-coins text-blue-500 mr-2"></i> क्रेडिट्स जोड़ें या VIP स्टेटस बदलें</h3>
            <form id="adminForm" onsubmit="window.addCreditsOrToggleVip(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">मौजूदा यूजर का ईमेल</label>
                        <input type="email" id="targetUser" placeholder="जिसके अकाउंट में क्रेडिट डालना है" required class="w-full p-3 border border-slate-300 rounded-xl text-sm bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">कितने क्रेडिट्स जोड़ने हैं?</label>
                        <input type="number" id="creditsToAdd" placeholder="जैसे: 50" required class="w-full p-3 border border-slate-300 rounded-xl text-sm bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>
                <div class="flex items-center space-x-2 pt-2 bg-blue-50 p-3 rounded-lg border border-blue-100">
                    <input type="checkbox" id="toggleVipStatus" class="w-5 h-5 text-blue-600 rounded">
                    <label for="toggleVipStatus" class="text-sm font-bold text-blue-900 cursor-pointer">इस यूजर का VIP स्टेटस ऑन (On) रखें</label>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-sm shadow-lg shadow-blue-200 transition">अपडेट करें</button>
            </form>
            <div id="adminMsg" class="hidden"></div>
        </div>
    </main>
    <footer class="bg-white border-t text-center py-4 text-xs font-bold text-slate-500 mt-auto">© 2026 ओवी आधार प्रिंट सर्विस - सुरक्षित एडमिन पैनल</footer>
</body>
</html>
