    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBSiDAvDYyBG8hkmez7s900JHhlbenG2nU",
            authDomain: "oaps-d2cce.firebaseapp.com",
            projectId: "oaps-d2cce",
            storageBucket: "oaps-d2cce.firebasestorage.app",
            messagingSenderId: "619616461386",
            appId: "1:619616461386:web:c3b9b36815369c6f5d7cb3",
            measurementId: "G-5Y6RHLE2LK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.currentUserData = null;
        window.historyData = []; 
        const ADMIN_EMAIL = "hkosiun1221@gmail.com"; 

        const API_URLS = {
            "BAGHPAT": "https://script.google.com/macros/s/AKfycbyA3916RXjuVRInvDPksOzbzczesTFAWo4gVzvjazGNfQl_REwC0YrYpTu03jlXwlb07w/exec",
            "SHAMLI": "https://script.google.com/macros/s/AKfycbzC1WjGvsvtXsMAhgaOtIBVLnQZ7COMaLl6-VCSvfENKtKJUJHfBYHayWr-orkGTIiQ/exec",
            "MUZAFFARNAGAR": "https://script.google.com/macros/s/AKfycby2FsD_wOd5ovuG4uVRldLBc8zMWKYoGXDPFPUoMKhx1k-KiAZcUa6MRe7TTW5VrfabLg/exec",
            "DOB": "https://script.google.com/macros/s/AKfycbyncAUbXWLplC_uHgodCqhPCDLTWFiWEQVzxPAInLP7zedGUQRdRbvix_jdDBJrYMlc9w/exec",
            "CASTE": "https://script.google.com/macros/s/AKfycbzUs_e_ga3Ly3SQ9qq5inqHgfC23-jzav8sjUES7XnPw7cyUn3DHhVEBFdgxqUejU5Y/exec"
        };
        window.API_URLS = API_URLS;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDocRef = doc(db, "users", user.uid);
                const userDoc = await getDoc(userDocRef);
                let userCredits = 0;
                let isVip = false;
                if (userDoc.exists()) {
                    userCredits = userDoc.data().credits || 0;
                    isVip = userDoc.data().isVip || false;
                }
                
                // Admin Flag check
                const isAdmin = (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase());
                
                window.currentUserData = { 
                    uid: user.uid, 
                    email: user.email, 
                    credits: userCredits, 
                    isVip: isVip, 
                    isAdmin: isAdmin,
                    username: user.email.split('@')[0] 
                };
                
                setupDashboard(window.currentUserData);
            }
        });

        window.handleLogin = async function(event) {
            event.preventDefault();
            const emailInput = document.getElementById('loginUsername').value.trim();
            const passInput = document.getElementById('loginPassword').value.trim();
            const errorDiv = document.getElementById('loginError');
            errorDiv.classList.add('hidden');

            const email = emailInput.includes('@') ? emailInput : `${emailInput.toLowerCase()}@ovportal.com`;

            try {
                await signInWithEmailAndPassword(auth, email, passInput);
            } catch (error) {
                errorDiv.innerText = "लॉगिन असफल: गलत यूजर आईडी या पासवर्ड!";
                errorDiv.classList.remove('hidden');
            }
        };

        function setupDashboard(userData) {
            document.getElementById('displayUser').innerText = userData.username.toUpperCase();
            
            const adminLink = document.getElementById('adminPanelLink');
            const creditDisplayBox = document.getElementById('creditDisplayBox');

            // ADMIN LOGIC (No Credits Displayed)
            if (userData.isAdmin) {
                adminLink.classList.remove('hidden');
                creditDisplayBox.classList.add('hidden'); // Hide credit box for admin
            } else {
                adminLink.classList.add('hidden');
                creditDisplayBox.classList.remove('hidden'); // Show credit box for normal users
                document.getElementById('displayCredits').innerText = userData.credits;
            }

            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            window.switchService('domicile');
        }

        window.handleLogout = async function() {
            await signOut(auth);
            window.currentUserData = null;
            window.location.reload();
        };

        // ================= IN-APP PREVIEW & MANUAL DOWNLOAD =================
        window.openPdfViewer = function(fileId, fileName) {
            document.getElementById('pdfViewerTitle').innerText = fileName;
            document.getElementById('pdfLoadingSpinner').style.display = 'flex';
            
            const previewUrl = `https://drive.google.com/file/d/${fileId}/preview`;
            document.getElementById('pdfIframe').src = previewUrl;
            
            const downloadBtn = document.getElementById('modalDownloadBtn');
            downloadBtn.onclick = function() {
                window.open(`https://drive.google.com/uc?export=download&id=${fileId}`, '_blank');
            };

            document.getElementById('pdfViewerModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden'; 
        };

        window.closePdfViewer = function() {
            document.getElementById('pdfViewerModal').classList.add('hidden');
            document.getElementById('pdfIframe').src = ''; 
            document.body.style.overflow = 'auto'; 
        };

        async function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const MAX_WIDTH = 500; 
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6)); 
                    };
                };
            });
        }

        // ================= FORM SUBMISSION LOGIC =================
        window.submitForm = async function(event, serviceType) {
            event.preventDefault();

            if (!window.currentUserData) return alert('कृपया पहले लॉगिन करें!');
            
            // Check Credits ONLY if the user is NOT an admin (Per Doc = 10 Credits)
            if (!window.currentUserData.isAdmin && window.currentUserData.credits < 10) {
                return alert('आपके पास पर्याप्त क्रेडिट्स नहीं हैं! प्रति डॉक्यूमेंट 10 क्रेडिट की आवश्यकता है।');
            }

            const formElement = event.target;
            const submitBtn = formElement.querySelector('button[type="submit"]');
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> प्रक्रिया जारी है...';
            submitBtn.disabled = true;

            const formData = new FormData(formElement);
            formData.append('USER_ID', window.currentUserData.email);
            formData.append('SERVICE_TYPE', serviceType);

            let targetUrl = "";
            if (serviceType === 'Domicile') targetUrl = API_URLS[formData.get('DISTRICT')] || API_URLS["BAGHPAT"];
            else if (serviceType === 'Caste') targetUrl = API_URLS["CASTE"];
            else if (serviceType === 'DOB') targetUrl = API_URLS["DOB"];

            try {
                // Deduct 10 Credits ONLY if NOT Admin
                if (!window.currentUserData.isAdmin) {
                    const userDocRef = doc(db, "users", window.currentUserData.uid);
                    const newCredits = window.currentUserData.credits - 10;
                    await updateDoc(userDocRef, { credits: newCredits });
                    window.currentUserData.credits = newCredits;
                    document.getElementById('displayCredits').innerText = newCredits;
                }

                const photoInput = formElement.querySelector('input[type="file"]');
                let base64Photo = "";
                if (photoInput && photoInput.files[0]) {
                    base64Photo = await compressImage(photoInput.files[0]);
                    formData.set('PHOTO', base64Photo);
                }

                const dataObj = {}; formData.forEach((v, k) => { dataObj[k] = v; });

                const response = await fetch(targetUrl, {
                    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(dataObj)
                });
                
                const result = await response.json();

                if (result.success || result.fileId) {
                    await addDoc(collection(db, "history"), {
                        userId: window.currentUserData.uid,
                        fileName: `${dataObj.NAME || 'Document'} - ${serviceType}.pdf`,
                        fileId: result.fileId || result.id || 'N/A',
                        serviceType: serviceType,
                        timestamp: new Date()
                    });
                    alert('डॉक्यूमेंट सफलतापूर्वक बन गया है!');
                    window.switchService('history');
                    formElement.reset();
                } else { throw new Error('API Response Failed'); }
            } catch (error) {
                // Refund 10 Credits ONLY if NOT Admin
                if (!window.currentUserData.isAdmin) {
                    const userDocRef = doc(db, "users", window.currentUserData.uid);
                    const refundedCredits = window.currentUserData.credits + 10;
                    await updateDoc(userDocRef, { credits: refundedCredits });
                    window.currentUserData.credits = refundedCredits;
                    document.getElementById('displayCredits').innerText = refundedCredits;
                }
                alert('तकनीकी समस्या आई है। आपके क्रेडिट वापस कर दिए गए हैं।');
            } finally {
                submitBtn.innerHTML = originalBtnText; submitBtn.disabled = false;
            }
        };

        // ================= HISTORY LOGIC =================
        window.loadUserHistory = async function() {
            const historyContainer = document.getElementById('historyTableBody');
            if (!historyContainer) return;
            historyContainer.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-slate-400 font-bold"><i class="fa-solid fa-spinner fa-spin text-3xl mb-2 text-brand-500"></i><br>डेटाबेस से फाइलें लोड हो रही हैं...</td></tr>`;

            try {
                const q = query(collection(db, "history"), where("userId", "==", window.currentUserData.uid));
                const querySnapshot = await getDocs(q);

                window.historyData = [];
                querySnapshot.forEach((docSnap) => { window.historyData.push(docSnap.data()); });
                window.historyData.sort((a, b) => b.timestamp.seconds - a.timestamp.seconds);
                window.renderHistory('ALL'); 
            } catch (err) { historyContainer.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500">हिस्ट्री लोड करने में असफल।</td></tr>`; }
        };

        window.renderHistory = function(filterType) {
            const historyContainer = document.getElementById('historyTableBody');
            historyContainer.innerHTML = '';

            const filteredData = filterType === 'ALL' ? window.historyData : window.historyData.filter(item => item.serviceType === filterType);
            document.getElementById('userHistoryCount').innerText = `कुल फाइलें: ${filteredData.length}`;

            if (filteredData.length === 0) {
                historyContainer.innerHTML = `<tr><td colspan="4" class="p-10 text-center text-slate-400"><i class="fa-regular fa-folder-open text-5xl mb-3 text-slate-300"></i><br>कोई रिकॉर्ड नहीं मिला।</td></tr>`;
                return;
            }

            filteredData.forEach((data) => {
                const dateObj = new Date(data.timestamp.seconds * 1000);
                const dateStr = dateObj.toLocaleDateString('hi-IN', {day:'2-digit', month:'short', year:'numeric'});
                const timeStr = dateObj.toLocaleTimeString('hi-IN', {hour:'2-digit', minute:'2-digit'});
                
                historyContainer.innerHTML += `
                    <tr class="border-b border-slate-100 text-sm hover:bg-brand-50 transition duration-200">
                        <td class="p-4 font-bold text-slate-800">${data.fileName}</td>
                        <td class="p-4"><span class="bg-indigo-100 text-indigo-700 border border-indigo-200 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">${data.serviceType}</span></td>
                        <td class="p-4 text-slate-500 text-xs font-medium">${dateStr} <br> ${timeStr}</td>
                        <td class="p-4 text-right whitespace-nowrap">
                            <button onclick="window.openPdfViewer('${data.fileId}', '${data.fileName}')" class="inline-flex items-center gap-1 bg-brand-50 text-brand-600 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-brand-600 hover:text-white transition shadow-sm border border-brand-200"><i class="fa-solid fa-eye"></i> प्रीव्यू</button>
                        </td>
                    </tr>
                `;
            });
        };

        window.updateTehsilsAndThanas = function() {
            const districtEl = document.getElementById('districtSelect');
            const tehsilSelect = document.getElementById('tehsilSelect');
            const thanaSelect = document.getElementById('thanaSelect');
            if (!districtEl || !tehsilSelect) return;
            const district = districtEl.value;
            let tehsils = []; let thanas = [];
            
            if (district === 'BAGHPAT') {
                tehsils = ['बड़ौत', 'खेकड़ा', 'बागपत']; thanas = ['बड़ौत', 'खेकड़ा', 'बागपत', 'छपरोली', 'बिनौली', 'रमाला', 'दोघट', 'सिंघावली अहीर', 'बालैनी', 'चांदीनगर'];
            } else if (district === 'SHAMLI') {
                tehsils = ['KAIRANA', 'OON', 'SHAMLI']; thanas = ['थाना भवन', 'कैराना', 'झिंझाना', 'शामली', 'बाबरी', 'कांधला', 'गढ़ी पुख्ता', 'आदर्श मंडी'];
            } else if (district === 'MUZAFFARNAGAR') {
                tehsils = ['BUDHANA', 'KHATOLI', 'JANSHATH', 'MUZAFFARNAGAR']; thanas = ['बुढ़ाना', 'खतौली', 'जानसठ', 'मीरापुर', 'सिविल लाइन', 'कोतवाली नगर', 'नई मंडी'];
            }
            tehsilSelect.innerHTML = tehsils.map(t => `<option value="${t}">${t}</option>`).join('');
            if (thanaSelect) thanaSelect.innerHTML = thanas.map(t => `<option value="${t}">${t}</option>`).join('');
        };

            });

            if(activeBtn) activeBtn.className = "service-tab bg-brand-600 text-white font-bold py-3.5 px-2 rounded-xl shadow-lg shadow-brand-200 transition transform -translate-y-1 text-sm md:text-base flex-1 flex justify-center items-center gap-2";

            // Text logic based on user role (Admin vs Normal)

                                ? 'डॉक्यूमेंट जनरेट करें <i class="fa-solid fa-wand-magic-sparkles ml-1"></i>' 
                                : 'डॉक्यूमेंट जनरेट करें (10 Credits) <i class="fa-solid fa-wand-magic-sparkles ml-1"></i>';
                                
            const adminTagHtml = window.currentUserData && window.currentUserData.isAdmin

            if(serviceName === 'domicile') {

                        ${adminTagHtml}
                    </div>
                    <form onsubmit="window.submitForm(event, 'Domicile')" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">जिला (District)</label><select id="districtSelect" name="DISTRICT" onchange="window.updateTehsilsAndThanas()" class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none transition"><option value="BAGHPAT">बागपत (Baghpat)</option><option value="SHAMLI">शामली (Shamli)</option><option value="MUZAFFARNAGAR">मुजफ्फरनगर (Muzaffarnagar)</option></select></div>
                            <div><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">तहसील (Tehsil)</label><select id="tehsilSelect" name="TAHSEEL" class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none uppercase transition"></select></div>
                            <div><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">रिश्ता (REL)</label><select name="REL" class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none uppercase transition"><option value="पुत्र / पुत्री">पुत्र / पुत्री</option><option value="पत्नी      .">पत्नी</option></select></div>
                            <div><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">कस्टमर का नाम</label><input type="text" name="NAME" required class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none uppercase transition"></div>
                            <div><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">हिंदी नाम (Optional)</label><input type="text" name="HNAME" class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none transition"></div>

                            <div><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">माता का नाम</label><input type="text" name="MNAME" required class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none uppercase transition"></div>
                            <div><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">मकान नंबर (MN)</label><input type="text" name="MN" required class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none uppercase transition"></div>
                            <div><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">मोहल्ला / क्षेत्र (Area)</label><input type="text" name="AREA" required class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none uppercase transition"></div>
                            <div><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">ग्राम / वार्ड (Gram)</label><input type="text" name="GRAM" required class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none uppercase transition"></div>
                            <div><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">थाना (Thana)</label><select id="thanaSelect" name="THANA" class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none uppercase transition"></select></div>

                        </div>
                        <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-black py-4 rounded-xl shadow-lg shadow-brand-200 hover:shadow-brand-300 transition transform hover:-translate-y-1 mt-4 text-base">${submitBtnText}</button>
                    </form>
                `;
                window.updateTehsilsAndThanas();
            } 
            else if(serviceName === 'caste') {
                container.innerHTML = `
                    <div class="flex justify-between items-center border-b border-slate-100 pb-4 mb-6">
                        <h3 class="text-xl font-black text-slate-800"><i class="fa-solid fa-users text-brand-500 mr-2"></i> जाति प्रमाण पत्र</h3>
                        ${adminTagHtml}
                    </div>
                    <form onsubmit="window.submitForm(event, 'Caste')" class="space-y-4">

                            <div><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">जिला (District)</label><select id="districtSelect" name="DISTRICT" onchange="window.updateTehsilsAndThanas()" class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none transition"><option value="BAGHPAT">बागपत</option><option value="SHAMLI">शामली</option><option value="MUZAFFARNAGAR">मुजफ्फरनगर</option></select></div>
                            <div><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">तहसील (Tehsil)</label><select id="tehsilSelect" name="TAHSEEL" class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none uppercase transition"></select></div>
                            <div><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">रिश्ता (REL)</label><select name="REL" class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none uppercase transition"><option value="पुत्र / पुत्री">पुत्र / पुत्री</option><option value="पत्नी      .">पत्नी</option></select></div>
                            <div><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">जाति (Caste)</label><select name="CAST" required class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none transition"><option value="जाट">जाट</option><option value="गुर्जर">गुर्जर</option><option value="कश्यप">कश्यप</option><option value="अहीर">अहीर</option><option value="ब्राह्मण">ब्राह्मण</option></select></div>
                            <div><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">कस्टमर का नाम</label><input type="text" name="NAME" required class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none uppercase transition"></div>
                            <div><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">हिंदी नाम (Optional)</label><input type="text" name="HNAME" class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none transition"></div>
                            <div><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">पिता/पति का नाम</label><input type="text" name="FNAME" required class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none uppercase transition"></div>
                            <div><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">माता का नाम</label><input type="text" name="MNAME" required class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none uppercase transition"></div>
                            <div><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">मोहल्ला / क्षेत्र</label><input type="text" name="AREA" required class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none uppercase transition"></div>
                            <div><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">ग्राम / वार्ड</label><input type="text" name="GRAM" required class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none uppercase transition"></div>
                            <div class="md:col-span-2"><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">VLE का नाम</label><input type="text" name="VLE" required class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none uppercase transition"></div>
                            <div class="md:col-span-2"><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">फोटो अपलोड करें</label><input type="file" name="PHOTO" accept="image/*" required class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none transition file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100"></div>
                        </div>
                        <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-black py-4 rounded-xl shadow-lg shadow-brand-200 hover:shadow-brand-300 transition transform hover:-translate-y-1 mt-4 text-base">${submitBtnText}</button>
                    </form>
                `;
                window.updateTehsilsAndThanas();
            }
            else if(serviceName === 'dob') {
                container.innerHTML = `
                    <div class="flex justify-between items-center border-b border-slate-100 pb-4 mb-6">
                        <h3 class="text-xl font-black text-slate-800"><i class="fa-solid fa-cake-candles text-brand-500 mr-2"></i> जन्म प्रमाण पत्र (DOB)</h3>
                        ${adminTagHtml}
                    </div>
                    <form onsubmit="window.submitForm(event, 'DOB')" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">नाम (Name)</label><input type="text" name="NAME" required class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none uppercase transition"></div>
                            <div><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">लिंग (Sex)</label><select name="SEX" class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none uppercase transition"><option value="MALE">MALE</option><option value="FEMALE">FEMALE</option></select></div>
                            <div><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">जन्मतिथि (DOB)</label><input type="date" name="DOB" required class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none transition"></div>
                            <div><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">पिता का नाम</label><input type="text" name="FNAME" required class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none uppercase transition"></div>
                            <div><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">माता का नाम</label><input type="text" name="MNAME" required class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none uppercase transition"></div>
                            <div><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">पिन कोड</label><input type="text" name="PIN" required class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none uppercase transition"></div>
                            <div class="md:col-span-2"><label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">पूरा पता (Address)</label><textarea name="ADDRESS" rows="2" required class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none uppercase transition"></textarea></div>
                        </div>
                        <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-black py-4 rounded-xl shadow-lg shadow-brand-200 hover:shadow-brand-300 transition transform hover:-translate-y-1 mt-4 text-base">${submitBtnText}</button>
                    </form>
                `;
            }
            else if(serviceName === 'history') {
                container.innerHTML = `
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-4 border-b border-slate-100 pb-6 mb-6">
                        <div>
                            <h3 class="text-2xl font-black text-slate-800 mb-1"><i class="fa-solid fa-folder-open text-brand-500 mr-2"></i> मेरी हिस्ट्री</h3>
                            <p id="userHistoryCount" class="text-sm font-bold text-brand-600 bg-brand-50 px-3 py-1 rounded-full inline-block">कुल फाइलें: 0</p>
                        </div>
                        
                        <div class="flex items-center gap-3 w-full md:w-auto">
                            <div class="flex-1 md:flex-none">
                                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">फ़िल्टर</label>
                                <select onchange="window.renderHistory(this.value)" class="w-full md:w-48 p-2.5 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:ring-2 focus:ring-brand-500 font-semibold cursor-pointer outline-none">
                                    <option value="ALL">सभी डॉक्युमेंट्स</option>
                                    <option value="Domicile">मूल निवास</option>
                                    <option value="Caste">जाति प्रमाण पत्र</option>
                                    <option value="DOB">जन्म प्रमाण पत्र</option>
                                    <option value="Annexure 1">Annexure 1</option>
                                    <option value="Annexure 1A">Annexure 1A</option>
                                    <option value="Annexure 3">Annexure 3</option>
                                    <option value="Affidavit">Affidavit</option>
                                </select>
                            </div>
                            <div class="flex items-end h-full mt-4 md:mt-0">
                                <button onclick="window.loadUserHistory()" class="h-[42px] bg-slate-100 text-slate-600 px-4 rounded-xl text-sm font-bold hover:bg-slate-200 transition" title="रिफ्रेश करें"><i class="fa-solid fa-rotate-right"></i></button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="overflow-x-auto border border-slate-200 rounded-2xl">
                        <table class="w-full text-left border-collapse bg-white min-w-[600px]">
                            <thead class="bg-slate-50 border-b border-slate-200 text-xs font-black text-slate-500 uppercase tracking-wider">
                                <tr><th class="p-4">फाइल का नाम</th><th class="p-4">प्रकार</th><th class="p-4">तारीख व समय</th><th class="p-4 text-right">एक्शन</th></tr>
                            </thead>
                            <tbody id="historyTableBody" class="text-sm text-slate-700"></tbody>
                        </table>
                    </div>
                `;
                window.loadUserHistory();
            }
        };
    </script>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col justify-between selection:bg-brand-300 selection:text-brand-900">
    
    <!-- FULL SCREEN PDF VIEWER MODAL (IN-APP) -->
    <div id="pdfViewerModal" class="fixed inset-0 z-[100] hidden bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-2 md:p-6 transition-opacity">
        <div class="bg-white w-full max-w-6xl h-full flex flex-col rounded-2xl shadow-2xl overflow-hidden">
            
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center p-4 border-b border-slate-200 bg-slate-50 gap-3">
                <div class="flex items-center gap-3 overflow-hidden w-full md:w-auto">
                    <div class="w-8 h-8 bg-brand-100 text-brand-600 rounded-lg flex items-center justify-center shrink-0"><i class="fa-solid fa-file-pdf"></i></div>
                    <h3 id="pdfViewerTitle" class="font-bold text-slate-800 truncate">डॉक्यूमेंट प्रीव्यू</h3>
                </div>
                <div class="flex items-center gap-3 w-full md:w-auto justify-end">
                    <!-- DEDICATED MANUAL DOWNLOAD BUTTON -->
                    <button id="modalDownloadBtn" class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition shadow-md flex items-center gap-2">
                        <i class="fa-solid fa-download"></i> डाउनलोड करें
                    </button>
                    <button onclick="window.closePdfViewer()" class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-200 text-slate-600 hover:bg-red-500 hover:text-white transition shadow-sm"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
            </div>

            <div class="flex-grow bg-slate-300 relative">
                <div id="pdfLoadingSpinner" class="absolute inset-0 flex flex-col items-center justify-center text-brand-600 bg-slate-100">
                    <i class="fa-solid fa-spinner fa-spin text-4xl mb-3"></i>
                    <p class="text-sm font-bold text-slate-600 mt-2">फ़ाइल कनेक्ट हो रही है...</p>
                </div>
                <iframe id="pdfIframe" class="w-full h-full relative z-10 border-none" onload="document.getElementById('pdfLoadingSpinner').style.display='none'" src=""></iframe>
            </div>
        </div>
    </div>


    <!-- LOGIN SCREEN -->
    <div id="loginSection" class="flex items-center justify-center flex-grow p-4">
        <div class="bg-white p-8 rounded-3xl shadow-card border border-slate-100 w-full max-w-md">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-brand-50 text-brand-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl border border-brand-100"><i class="fa-solid fa-print"></i></div>
                <h1 class="text-2xl font-black text-slate-800">ओवी आधार सर्विस</h1>
                <p class="text-sm font-semibold text-slate-500 mt-1">अपने क्रेडेंशियल्स दर्ज करें</p>
            </div>
            <form id="loginForm" onsubmit="window.handleLogin(event)" class="space-y-4">
                <input type="text" id="loginUsername" placeholder="यूजर आईडी (जैसे: rahul)" required class="w-full px-4 py-3.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none bg-slate-50 text-sm font-semibold transition">
                <input type="password" id="loginPassword" placeholder="पासवर्ड" required class="w-full px-4 py-3.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none bg-slate-50 text-sm font-semibold transition">
                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-black py-3.5 rounded-xl shadow-lg shadow-brand-200 hover:shadow-brand-300 transition transform hover:-translate-y-0.5 mt-2">लॉगिन करें <i class="fa-solid fa-arrow-right ml-1"></i></button>
            </form>
            <div id="loginError" class="mt-4 text-center text-sm font-bold text-red-500 hidden bg-red-50 p-2 rounded-lg border border-red-100"></div>
        </div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="dashboardSection" class="hidden flex-grow flex flex-col">
        <header class="bg-white shadow-card px-4 md:px-8 py-4 flex justify-between items-center sticky top-0 z-40 border-b border-slate-200">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-brand-50 text-brand-600 rounded-xl flex items-center justify-center border border-brand-100"><i class="fa-solid fa-print text-lg"></i></div>
                <div>
                    <h2 class="text-lg md:text-xl font-black text-slate-800 leading-tight">ओवी पोर्टल</h2>
                    <p class="text-xs text-slate-500 font-bold">नमस्ते, <span id="displayUser" class="text-brand-600"></span></p>
                </div>
            </div>
            <div class="flex items-center gap-3 md:gap-4">
                <a href="admin.html" id="adminPanelLink" class="hidden bg-amber-50 border border-amber-200 text-amber-700 px-3 py-1.5 md:px-4 md:py-2 rounded-xl text-sm font-bold shadow-sm transition hover:bg-amber-100"><i class="fa-solid fa-shield-halved mr-1"></i> <span class="hidden md:inline">एडमिन पैनल</span></a>
                
                <div id="creditDisplayBox" class="bg-green-50 border border-green-200 px-3 py-1.5 md:px-4 md:py-2 rounded-xl text-sm font-bold text-green-700 shadow-sm flex items-center">
                    <i class="fa-solid fa-wallet mr-2 text-green-600"></i> क्रेडिट्स: <span id="displayCredits" class="ml-1 text-lg font-black">0</span>
                </div>
                
                <button onclick="window.handleLogout()" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-100 px-3 py-1.5 md:px-4 md:py-2 rounded-xl text-sm font-bold transition shadow-sm"><i class="fa-solid fa-power-off"></i> <span class="hidden md:inline ml-1">लॉगआउट</span></button>
            </div>
        </header>

        <main class="max-w-6xl mx-auto w-full p-4 md:p-8 flex-grow">
            <div class="flex flex-col md:flex-row gap-3 md:gap-4 mb-8">
                <button onclick="window.switchService('domicile')" id="btn-domicile" class="service-tab"><i class="fa-solid fa-house-chimney"></i> मूल निवास</button>
                <button onclick="window.switchService('caste')" id="btn-caste" class="service-tab"><i class="fa-solid fa-users"></i> जाति प्रमाण</button>
                <button onclick="window.switchService('dob')" id="btn-dob" class="service-tab"><i class="fa-solid fa-cake-candles"></i> जन्म प्रमाण (DOB)</button>
                <button onclick="window.switchService('history')" id="btn-history" class="service-tab"><i class="fa-solid fa-clock-rotate-left"></i> मेरी हिस्ट्री</button>
            </div>
            <div class="bg-white rounded-3xl shadow-card border border-slate-100 p-6 md:p-8">
                <div id="formContainer"></div>
            </div>
        </main>
    </div>
    
    <footer class="bg-slate-50 border-t border-slate-200 text-center py-4 text-xs font-bold text-slate-400 mt-auto">
        © 2026 ओवी आधार प्रिंट सर्विस | सुरक्षित व प्राइवेट पोर्टल
    </footer>
</body>
</html>
