        window.handleChangePassword = async function(event) {
            event.preventDefault();
            const currentPass = document.getElementById('currentPassword').value;
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;
            const msgBox = document.getElementById('passwordMsgBox');
            const btn = document.getElementById('btnChangePass');

            msgBox.style.display = 'none';

            if (newPass.length < 6) {
                msgBox.className = "p-4 rounded-xl text-sm font-bold bg-red-50 text-red-600 border border-red-200 text-center";
                msgBox.innerText = "नया पासवर्ड कम से कम 6 अक्षरों (Characters) का होना चाहिए!";
                msgBox.style.display = 'block';
                return;
            }

            if (newPass !== confirmPass) {
                msgBox.className = "p-4 rounded-xl text-sm font-bold bg-red-50 text-red-600 border border-red-200 text-center";
                msgBox.innerText = "नया पासवर्ड और कन्फर्म पासवर्ड आपस में मैच नहीं कर रहे हैं!";
                msgBox.style.display = 'block';
                return;
            }

            const origText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> पासवर्ड बदला जा रहा है...';
            btn.disabled = true;

            try {
                const user = auth.currentUser;
                const credential = EmailAuthProvider.credential(user.email, currentPass);
                
                // Re-authenticate user first
                await reauthenticateWithCredential(user, credential);
                
                // Update to new password
                await updatePassword(user, newPass);

                msgBox.className = "p-4 rounded-xl text-sm font-bold bg-green-50 text-green-700 border border-green-200 text-center";

                msgBox.style.display = 'block';
            } finally {
                btn.innerHTML = origText;
                btn.disabled = false;
            }
        };

        async function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const MAX_WIDTH = 500; 
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6)); 
                    };
                };
            });
        }

        window.submitForm = async function(event, serviceType) {
            event.preventDefault();

            if (!window.currentUserData) return alert('Please login first!');
            if (!window.currentUserData.isAdmin && window.currentUserData.credits < 10) {
                return alert('Insufficient credits! You need 10 credits to generate a document. Please add credits from your wallet.');
            }

            const formElement = event.target;
            const submitBtn = formElement.querySelector('button[type="submit"]');
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Processing...';
            submitBtn.disabled = true;

            const formData = new FormData(formElement);
            formData.append('USER_ID', window.currentUserData.email);
            formData.append('SERVICE_TYPE', serviceType);

            let targetUrl = "";
            if (serviceType === 'Domicile') targetUrl = API_URLS[formData.get('DISTRICT')] || API_URLS["BAGHPAT"];
            else if (serviceType === 'Caste') targetUrl = API_URLS["CASTE"];
            else if (serviceType === 'DOB' || serviceType === 'DOB 18+') targetUrl = API_URLS["DOB"];
            else if (serviceType.toLowerCase().includes('annexure')) targetUrl = API_URLS["ANNEXURE"];

            try {
                if (!window.currentUserData.isAdmin) {
                    const userDocRef = doc(db, "users", window.currentUserData.uid);
                    const newCredits = window.currentUserData.credits - 10;
                    await updateDoc(userDocRef, { credits: newCredits });
                    window.currentUserData.credits = newCredits;
                    document.getElementById('displayCredits').innerText = newCredits;
                }

                const photoInput = formElement.querySelector('input[type="file"]');
                let base64Photo = "";
                if (photoInput && photoInput.files[0]) {
                    base64Photo = await compressImage(photoInput.files[0]);
                    formData.set('PHOTO', base64Photo);
                }

                const dataObj = {}; formData.forEach((v, k) => { dataObj[k] = v; });

                const response = await fetch(targetUrl, {
                    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(dataObj)
                });
                
                const result = await response.json();

                if (result.success || result.fileId) {
                    await addDoc(collection(db, "history"), {
                        userId: window.currentUserData.uid,
                        fileName: `${dataObj.NAME || 'Document'} - ${serviceType}.pdf`,
                        fileId: result.fileId || result.id || 'N/A',
                        serviceType: serviceType,
                        timestamp: new Date()
                    });
                    alert('Success! Document generated successfully.');
                    window.switchService('history');
                    formElement.reset();
                } else { throw new Error('API Response Failed'); }
            } catch (error) {
                if (!window.currentUserData.isAdmin) {
                    const userDocRef = doc(db, "users", window.currentUserData.uid);
                    const refundedCredits = window.currentUserData.credits + 10;
                    await updateDoc(userDocRef, { credits: refundedCredits });
                    window.currentUserData.credits = refundedCredits;
                    document.getElementById('displayCredits').innerText = refundedCredits;
                }
                alert('Technical error occurred. Your credits have been refunded.');
            } finally {
                submitBtn.innerHTML = originalBtnText; submitBtn.disabled = false;
            }
        };

        window.loadUserHistory = async function() {
            const historyContainer = document.getElementById('historyTableBody');
            if (!historyContainer) return;
            historyContainer.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-slate-400 font-bold"><i class="fa-solid fa-spinner fa-spin text-3xl mb-2 text-royal-500"></i><br>Loading records...</td></tr>`;

            try {
                const q = query(collection(db, "history"), where("userId", "==", window.currentUserData.uid));
                const querySnapshot = await getDocs(q);

                window.historyData = [];
                querySnapshot.forEach((docSnap) => { window.historyData.push(docSnap.data()); });
                window.historyData.sort((a, b) => b.timestamp.seconds - a.timestamp.seconds);
                window.renderHistory('ALL'); 
            } catch (err) { historyContainer.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500">Failed to load history.</td></tr>`; }
        };

        window.renderHistory = function(filterType) {
            const historyContainer = document.getElementById('historyTableBody');
            historyContainer.innerHTML = '';

            const filteredData = filterType === 'ALL' ? window.historyData : window.historyData.filter(item => item.serviceType === filterType);
            document.getElementById('userHistoryCount').innerText = `Total Files: ${filteredData.length}`;

            if (filteredData.length === 0) {
                historyContainer.innerHTML = `<tr><td colspan="4" class="p-10 text-center text-slate-400"><i class="fa-regular fa-folder-open text-5xl mb-3 text-slate-300"></i><br>No records found.</td></tr>`;
                return;
            }

            filteredData.forEach((data) => {
                const dateObj = new Date(data.timestamp.seconds * 1000);
                const dateStr = dateObj.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
                const timeStr = dateObj.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'});
                
                historyContainer.innerHTML += `
                    <tr class="border-b border-slate-100 text-sm hover:bg-slate-50 transition duration-200">
                        <td class="p-4 font-bold text-slate-800">${data.fileName}</td>
                        <td class="p-4"><span class="bg-indigo-100 text-indigo-700 border border-indigo-200 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">${data.serviceType}</span></td>
                        <td class="p-4 text-slate-500 text-xs font-medium">${dateStr} <br> ${timeStr}</td>
                        <td class="p-4 text-right whitespace-nowrap">
                            <button onclick="window.openPdfViewer('${data.fileId}', '${data.fileName}')" class="inline-flex items-center gap-1 bg-royal-50 text-royal-700 border border-royal-200 hover:bg-royal-600 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-sm">
                                <i class="fa-solid fa-eye"></i> Preview
                            </button>
                        </td>
                    </tr>
                `;
            });
        };

        // HINDI DROPDOWNS
        window.updateTehsilsAndThanas = function() {
            const districtEl = document.getElementById('districtSelect');
            const tehsilSelect = document.getElementById('tehsilSelect');
            const thanaSelect = document.getElementById('thanaSelect');
            if (!districtEl || !tehsilSelect) return;

                            <div class="p-6 bg-white rounded-2xl border border-royal-200 text-center shadow-card mt-4">
                                <p class="text-xs font-bold text-royal-600 uppercase mb-1 tracking-widest">You will get</p>
                                <p class="text-4xl font-black text-dark-900" id="calculatedCredits">0 <span class="text-sm font-bold text-slate-400">Credits</span></p>
                            </div>
                            
                            <button id="btnGenerateQR" onclick="window.generateQR()" class="w-full bg-dark-900 hover:bg-black text-royal-300 font-black py-4 rounded-xl shadow-glow transition transform hover:-translate-y-0.5 mt-2">Generate Payment QR</button>
                        </div>

                        <div id="qrSection" style="display: none;" class="flex-col items-center justify-center space-y-5 bg-white p-6 rounded-3xl border-2 border-royal-400 shadow-card relative">
                            <h4 class="text-[11px] font-bold text-royal-700 uppercase tracking-widest text-center bg-royal-100 px-4 py-2 rounded-full"><i class="fa-solid fa-qrcode mr-1"></i> Scan & Pay using any UPI App</h4>
                            
                            <div class="p-3 border border-slate-200 rounded-2xl bg-white shadow-sm">
                                <img id="upiQRCode" src="" alt="UPI QR Code" class="w-48 h-48 md:w-56 md:h-56 object-contain">
                            </div>
                            
                            <div class="w-full pt-2">
                                <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1 text-center">Enter 12-Digit UTR / Ref Number</label>
                                <input type="text" id="utrNumber" placeholder="Enter UTR after payment" class="w-full p-4 border border-slate-200 rounded-xl text-sm font-bold bg-slate-50 focus:bg-white focus:ring-2 focus:ring-amber-500 outline-none transition text-center tracking-widest uppercase">
                            </div>
                            
                            <button onclick="window.submitPayment()" id="btnSubmitPayment" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-black py-4 rounded-xl shadow-md transition transform hover:-translate-y-0.5">Submit For Verification <i class="fa-solid fa-paper-plane ml-1"></i></button>
                            <p id="paymentErrorMsg" style="display: none;" class="text-xs font-bold text-red-500 text-center mt-2 p-2 bg-red-50 rounded-lg border border-red-200"></p>
                        </div>
                    </div>
                `;
            }

            // 6. CHANGE PASSWORD SECTION (NEW)
            else if(serviceName === 'password') {
                container.innerHTML = `
                    <div class="max-w-md mx-auto py-4">
                        <div class="text-center mb-6">
                            <div class="w-16 h-16 bg-royal-100 text-royal-600 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl shadow-sm border border-royal-200">
                                <i class="fa-solid fa-key"></i>
                            </div>
                            <h3 class="text-2xl font-black text-dark-900">Change Your Password</h3>
                            <p class="text-xs font-bold text-slate-400 mt-1">अपना पुराना पासवर्ड डालकर नया पासवर्ड सेट करें</p>
                        </div>

                        <form onsubmit="window.handleChangePassword(event)" class="space-y-4 bg-slate-50 p-6 rounded-3xl border border-slate-200">
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">Current Password (पुराना पासवर्ड)</label>
                                <input type="password" id="currentPassword" required placeholder="Enter current password" class="w-full p-3.5 border border-slate-200 rounded-xl text-sm bg-white focus:ring-2 focus:ring-royal-400 outline-none transition font-semibold">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">New Password (नया पासवर्ड)</label>
                                <input type="password" id="newPassword" required minlength="6" placeholder="Minimum 6 characters" class="w-full p-3.5 border border-slate-200 rounded-xl text-sm bg-white focus:ring-2 focus:ring-royal-400 outline-none transition font-semibold">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">Confirm New Password (दोबारा लिखें)</label>
                                <input type="password" id="confirmPassword" required minlength="6" placeholder="Re-enter new password" class="w-full p-3.5 border border-slate-200 rounded-xl text-sm bg-white focus:ring-2 focus:ring-royal-400 outline-none transition font-semibold">
                            </div>
                            <div id="passwordMsgBox" style="display: none;"></div>
                            <button type="submit" id="btnChangePass" class="w-full bg-dark-900 hover:bg-black text-royal-300 font-black py-4 rounded-xl shadow-glow transition transform hover:-translate-y-0.5 mt-2">
                                Update Password <i class="fa-solid fa-lock ml-1"></i>
                            </button>
                        </form>
                    </div>
                `;
            }
            
            // 7. MY HISTORY
            else if(serviceName === 'history') {
                const isVipUser = window.currentUserData && window.currentUserData.isVip;
                const vipFilterOptions = isVipUser ? `
                    <option value="DOB 18+">जन्म प्रमाण पत्र (18+)</option>
                    <option value="Annexure 1">Annexure 1</option>
                    <option value="Annexure 1A">Annexure 1A</option>
                    <option value="Annexure 3">Annexure 3</option>
                    <option value="Annexure 3A">Annexure 3A</option>
                    <option value="Annexure B">Annexure B</option>
                    <option value="Annexure C">Annexure C</option>
                    <option value="Annexure D">Annexure D</option>
                    <option value="Annexure E">Annexure E</option>
                ` : '';

                container.innerHTML = `
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-4 border-b border-slate-100 pb-6 mb-6">
                        <div>
                            <h3 class="text-2xl font-black text-dark-900 mb-1"><i class="fa-solid fa-folder-open text-royal-500 mr-2"></i> My History</h3>
                            <p id="userHistoryCount" class="text-sm font-bold text-royal-600 bg-royal-50 border border-royal-200 px-3 py-1 rounded-full inline-block">Total Files: 0</p>
                        </div>
                        
                        <div class="flex items-center gap-3 w-full md:w-auto">
                            <div class="flex-1 md:flex-none">
                                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Filter Type</label>
                                <select onchange="window.renderHistory(this.value)" class="w-full md:w-52 p-2.5 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:ring-2 focus:ring-royal-400 font-semibold cursor-pointer outline-none">
                                    <option value="ALL">All Documents</option>
                                    <option value="Domicile">मूल निवास</option>
                                    <option value="Caste">जाति प्रमाण पत्र</option>
                                    ${vipFilterOptions}
                                </select>
                            </div>
                            <div class="flex items-end h-full mt-4 md:mt-0">
                                <button onclick="window.loadUserHistory()" class="h-[42px] bg-slate-100 text-slate-600 px-4 rounded-xl text-sm font-bold hover:bg-slate-200 transition shadow-sm" title="Refresh"><i class="fa-solid fa-rotate-right"></i></button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="overflow-x-auto border border-slate-200 rounded-2xl">
                        <table class="w-full text-left border-collapse bg-white min-w-[600px]">
                            <thead class="bg-slate-50 border-b border-slate-200 text-[11px] font-black text-slate-400 uppercase tracking-wider">
                                <tr><th class="p-4 rounded-tl-2xl">File Name</th><th class="p-4">Type</th><th class="p-4">Date & Time</th><th class="p-4 text-right rounded-tr-2xl">Action</th></tr>
                            </thead>
                            <tbody id="historyTableBody" class="text-sm text-slate-700"></tbody>
                        </table>
                    </div>
                `;
                window.loadUserHistory();
            }
        };
    </script>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col justify-between selection:bg-royal-300 selection:text-dark-900 transition-colors duration-300">
    
    <!-- SECURITY LOADING SCREEN -->
    <div id="loadingScreen" style="display: flex;" class="fixed inset-0 bg-dark-900 z-[200] flex-col items-center justify-center">
        <i class="fa-solid fa-sun text-7xl text-royal-400 mb-6 animate-spin-slow"></i>
        <h2 class="text-2xl font-black text-white tracking-widest uppercase">Ojas Print Service</h2>
        <p class="text-sm text-royal-300 mt-2 font-bold animate-pulse">Checking Security...</p>
    </div>

    <!-- FULL SCREEN PDF VIEWER MODAL -->
    <div id="pdfViewerModal" style="display: none;" class="fixed inset-0 z-[100] bg-dark-900/80 backdrop-blur-md items-center justify-center p-2 md:p-6 transition-opacity">
        <div class="bg-white w-full max-w-6xl h-full flex flex-col rounded-2xl shadow-2xl overflow-hidden">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center p-4 border-b border-slate-200 bg-slate-50 gap-3">
                <div class="flex items-center gap-3 overflow-hidden w-full md:w-auto">
                    <div class="w-8 h-8 bg-royal-100 text-royal-600 rounded-lg flex items-center justify-center shrink-0"><i class="fa-solid fa-file-pdf"></i></div>
                    <h3 id="pdfViewerTitle" class="font-bold text-slate-800 truncate">Document Preview</h3>
                </div>
                <div class="flex items-center gap-3 w-full md:w-auto justify-end">
                    <button id="modalDownloadBtn" class="bg-dark-900 hover:bg-black text-royal-300 px-4 py-2 rounded-xl text-sm font-bold transition shadow-glow flex items-center gap-2 border border-dark-800">
                        <i class="fa-solid fa-download"></i> Download
                    </button>
                    <button onclick="window.closePdfViewer()" class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-200 text-slate-600 hover:bg-red-500 hover:text-white transition shadow-sm"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
            </div>
            <div class="flex-grow bg-slate-300 relative">
                <div id="pdfLoadingSpinner" class="absolute inset-0 flex flex-col items-center justify-center text-royal-600 bg-slate-100">
                    <i class="fa-solid fa-spinner fa-spin text-4xl mb-3"></i>
                    <p class="text-sm font-bold text-slate-600 mt-2">Loading Preview...</p>
                </div>
                <iframe id="pdfIframe" class="w-full h-full relative z-10 border-none" onload="document.getElementById('pdfLoadingSpinner').style.display='none'" src=""></iframe>
            </div>
        </div>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="loginSection" style="display: none;" class="items-center justify-center flex-grow p-4 min-h-screen bg-dark-900 relative overflow-hidden">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-royal-500/20 rounded-full blur-[100px] pointer-events-none"></div>
        <div class="bg-white p-8 md:p-10 rounded-3xl shadow-[0_0_40px_rgba(245,158,11,0.15)] border-t-4 border-royal-500 w-full max-w-md relative z-10 text-slate-800">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-gradient-to-br from-royal-300 to-royal-600 text-white rounded-full flex items-center justify-center mx-auto mb-5 text-4xl shadow-glow">
                    <i class="fa-solid fa-sun"></i>
                </div>
                <h1 class="text-3xl font-black text-dark-900 tracking-tight">Ojas Print Service</h1>
                <p class="text-[10px] font-bold text-slate-400 mt-2 uppercase tracking-widest">Secure Portal Login</p>
            </div>
            <form id="loginForm" onsubmit="window.handleLogin(event)" class="space-y-5">
                <input type="text" id="loginUsername" placeholder="User ID / Email" required class="w-full px-5 py-4 border border-slate-200 rounded-xl focus:ring-2 focus:ring-royal-500 outline-none bg-slate-50 text-sm font-semibold transition">
                <input type="password" id="loginPassword" placeholder="Password" required class="w-full px-5 py-4 border border-slate-200 rounded-xl focus:ring-2 focus:ring-royal-500 outline-none bg-slate-50 text-sm font-semibold transition">
                <button type="submit" class="w-full bg-dark-900 hover:bg-black text-royal-300 font-black py-4 rounded-xl shadow-glow transition transform hover:-translate-y-0.5 mt-2 text-base">Secure Login <i class="fa-solid fa-arrow-right ml-1"></i></button>
            </form>
            <div id="loginError" style="display: none;" class="mt-5 text-center text-sm font-bold text-red-500 bg-red-50 p-3 rounded-xl border border-red-100"></div>
        </div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="dashboardSection" style="display: none;" class="flex-grow flex-col">
        <header class="bg-dark-950 shadow-2xl px-4 md:px-8 py-4 flex justify-between items-center sticky top-0 z-40 border-b-2 border-royal-500">
            <div class="flex items-center gap-3">
                <div id="portalHeaderIcon" class="w-10 h-10 bg-gradient-to-br from-royal-400 to-royal-600 text-white rounded-xl flex items-center justify-center shadow-inner">
                    <i class="fa-solid fa-sun text-lg"></i>
                </div>
                <div class="flex items-center gap-2.5">
                    <h2 id="portalHeaderTitle" class="text-lg md:text-xl font-black text-white leading-tight">Ojas <span class="text-royal-400">Portal</span></h2>
                    <span id="vipStatusBadge" style="display: none;" class="items-center gap-1 bg-gradient-to-r from-yellow-300 via-royal-400 to-amber-500 text-dark-950 text-[10px] font-black px-2.5 py-0.5 rounded-full uppercase tracking-widest shadow-vip-glow">
                        <i class="fa-solid fa-crown text-[9px]"></i> VIP ACCESS
                    </span>
                </div>
            </div>
            <div class="flex items-center gap-3 md:gap-4">
                <p class="text-xs text-slate-400 font-bold hidden md:block">Welcome, <span id="displayUser" class="text-white"></span></p>
                <a href="admin.html" id="adminPanelLink" style="display: none;" class="bg-dark-800 border border-slate-700 text-royal-300 hover:text-white px-3 py-1.5 md:px-4 md:py-2 rounded-xl text-sm font-bold shadow-sm transition"><i class="fa-solid fa-shield-halved mr-1"></i> <span class="hidden md:inline">Admin Panel</span></a>
                
                <div id="creditDisplayBox" style="display: none;" class="bg-royal-500/10 border border-royal-500/30 px-3 py-1.5 md:px-4 md:py-2 rounded-xl text-sm font-bold text-royal-400 shadow-sm items-center cursor-pointer hover:bg-royal-500/20 transition" onclick="window.switchService('add_credit')" title="Add Credits">
                    <i class="fa-solid fa-wallet mr-2 text-royal-500"></i> Credits: <span id="displayCredits" class="ml-1 text-lg font-black text-white">0</span>
                </div>
                
                <button onclick="window.handleLogout()" class="bg-red-500/10 hover:bg-red-500 hover:text-white text-red-400 border border-red-500/30 px-3 py-1.5 md:px-4 md:py-2 rounded-xl text-sm font-bold transition shadow-sm"><i class="fa-solid fa-power-off"></i> <span class="hidden md:inline ml-1">Logout</span></button>
            </div>
        </header>

        <main class="max-w-6xl mx-auto w-full p-4 md:p-8 flex-grow">
            <!-- Standard Navigation Grid (Normal Users see ONLY Domicile & Caste here, NO DOB) -->
            <div class="grid grid-cols-2 md:grid-cols-5 gap-3 md:gap-4 mb-6">
                <button onclick="window.switchService('domicile')" id="btn-domicile" class="service-tab"><i class="fa-solid fa-house-chimney"></i> Domicile</button>
                <button onclick="window.switchService('caste')" id="btn-caste" class="service-tab"><i class="fa-solid fa-users"></i> Caste Cert</button>
                <button onclick="window.switchService('history')" id="btn-history" class="service-tab"><i class="fa-solid fa-clock-rotate-left"></i> My History</button>
                <button onclick="window.switchService('password')" id="btn-password" class="service-tab"><i class="fa-solid fa-key"></i> Password</button>
                <button onclick="window.switchService('add_credit')" id="btn-add_credit" class="service-tab col-span-2 md:col-span-1 !bg-amber-50 !text-amber-700 !border-amber-200 hover:!bg-amber-100"><i class="fa-solid fa-plus-circle"></i> Add Credit</button>
            </div>

            <!-- 👑 VIP EXCLUSIVE SERVICES PANEL (Visible ONLY when isVip == true) -->
            <div id="vipServicesBar" style="display: none;" class="mb-8 p-5 rounded-3xl bg-gradient-to-r from-dark-950 via-dark-900 to-dark-950 border-2 border-royal-400 shadow-vip-glow">
                <div class="flex items-center justify-between mb-3 border-b border-slate-800 pb-2.5">
                    <span class="text-xs font-black uppercase tracking-widest text-royal-300 flex items-center gap-2">
                        <i class="fa-solid fa-crown text-royal-400 animate-bounce"></i> VIP Exclusive Services (18+ DOB & All Annexures)
                    </span>
                    <span class="text-[10px] font-bold text-slate-400 hidden sm:inline">Premium Unlocked</span>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2.5">
                    <button onclick="window.switchService('dob18')" id="btn-dob18" class="vip-tab"><i class="fa-solid fa-cake-candles"></i> DOB (18+)</button>
                    <button onclick="window.switchService('annexure1')" id="btn-annexure1" class="vip-tab"><i class="fa-solid fa-file-signature"></i> Annexure 1</button>
                    <button onclick="window.switchService('annexure1a')" id="btn-annexure1a" class="vip-tab"><i class="fa-solid fa-file-signature"></i> Annexure 1A</button>
                    <button onclick="window.switchService('annexure3')" id="btn-annexure3" class="vip-tab"><i class="fa-solid fa-file-signature"></i> Annexure 3</button>
                    <button onclick="window.switchService('annexure3a')" id="btn-annexure3a" class="vip-tab"><i class="fa-solid fa-file-signature"></i> Annexure 3A</button>
                    <button onclick="window.switchService('annexureb')" id="btn-annexureb" class="vip-tab"><i class="fa-solid fa-file-contract"></i> Annexure B</button>
                    <button onclick="window.switchService('annexurec')" id="btn-annexurec" class="vip-tab"><i class="fa-solid fa-file-contract"></i> Annexure C</button>
                    <button onclick="window.switchService('annexured')" id="btn-annexured" class="vip-tab"><i class="fa-solid fa-file-contract"></i> Annexure D</button>
                    <button onclick="window.switchService('annexuree')" id="btn-annexuree" class="vip-tab"><i class="fa-solid fa-file-contract"></i> Annexure E</button>
                </div>
            </div>
            
            <!-- Dynamic Form Container -->
            <div id="mainFormCard" class="bg-white text-slate-800 rounded-3xl shadow-card border border-slate-100 p-6 md:p-8">
                <div id="formContainer"></div>
            </div>
        </main>
    </div>
    
    <footer class="bg-dark-950 border-t border-slate-800 text-center py-5 text-[11px] font-bold text-slate-400 mt-auto uppercase tracking-widest">
        © 2026 Ojas Print Service | Secure Portal
    </footer>
</body>
