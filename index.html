<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ओवी आधार प्रिंट सर्विस - पोर्टल</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- 1. LOGIN SCREEN -->
    <div id="loginSection" class="flex items-center justify-center flex-grow p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-slate-800">ओवी आधार प्रिंट सर्विस</h1>
                <p class="text-sm text-slate-500 mt-1">कृपया अपने यूजर आईडी से लॉगिन करें</p>
            </div>
            
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">यूजर आईडी (Username)</label>
                    <input type="text" id="username" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none uppercase">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">पासवर्ड (Password)</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md">
                    लॉगिन करें
                </button>
            </form>
            <div id="loginError" class="mt-4 text-center text-sm text-red-600 hidden"></div>
        </div>
    </div>

    <!-- 2. DASHBOARD SCREEN (Hidden by default) -->
    <div id="dashboardSection" class="hidden flex-grow flex flex-col">
        <!-- Header Navbar -->
        <header class="bg-white shadow-sm border-b border-slate-200 px-6 py-4 flex justify-between items-center">
            <div>
                <h2 class="text-xl font-bold text-slate-800">ओवी पोर्टल डैशबोर्ड</h2>
                <p class="text-xs text-slate-500">यूजर: <span id="displayUser" class="font-semibold text-blue-600"></span></p>
            </div>
            <div class="flex items-center space-x-4">
                <div class="bg-blue-50 border border-blue-200 px-3 py-1.5 rounded-lg text-sm font-medium text-blue-800">
                    क्रेडिट्स: <span id="displayCredits" class="font-bold text-blue-900">0</span>
                </div>
                <button onclick="handleLogout()" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-sm font-medium transition">
                    लॉगआउट
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="max-w-4xl mx-auto w-full p-6 flex-grow">
            <!-- Service Selector Tabs -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                <button onclick="switchService('domicile')" id="btn-domicile" class="service-tab bg-blue-600 text-white py-2.5 px-4 rounded-xl font-medium text-sm text-center shadow-sm transition">मूल निवास (Domicile)</button>
                <button onclick="switchService('dob')" id="btn-dob" class="service-tab bg-white text-slate-700 border border-slate-200 py-2.5 px-4 rounded-xl font-medium text-sm text-center shadow-sm transition hover:bg-slate-50">DOB सर्टिफिकेट</button>
                <button onclick="switchService('annexure')" id="btn-annexure" class="service-tab bg-white text-slate-700 border border-slate-200 py-2.5 px-4 rounded-xl font-medium text-sm text-center shadow-sm transition hover:bg-slate-50">Annexure 1</button>
                <button onclick="switchService('history')" id="btn-history" class="service-tab bg-white text-slate-700 border border-slate-200 py-2.5 px-4 rounded-xl font-medium text-sm text-center shadow-sm transition hover:bg-slate-50">मेरी हिस्ट्री (History)</button>
            </div>

            <!-- Dynamic Form Container -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <div id="formContainer">
                    <!-- Forms will be loaded here via JavaScript -->
                </div>
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 text-center py-4 text-xs text-slate-500">
        © 2026 ओवी आधार प्रिंट सर्विस. सर्वाधिकार सुरक्षित.
    </footer>

    <!-- JavaScript Logic & Backend Integration -->
    <script>
        let currentUser = null;

        // आपके सभी 5 सर्विसेज के फाइनल Apps Script Web App URLs
        const API_URLS = {
            "BAGHPAT": "https://script.google.com/macros/s/AKfycbyA3916RXjuVRInvDPksOzbzczesTFAWo4gVzvjazGNfQl_REwC0YrYpTu03jlXwlb07w/exec",
            "SHAMLI": "https://script.google.com/macros/s/AKfycbx14PgIaqdbvNCPQaoIT7gCEbOlEP3I7itkoCgLMTEg8jLBuZ7k490WSC01CkKPvsuP/exec",
            "MUZAFFARNAGAR": "https://script.google.com/macros/s/AKfycby2FsD_wOd5ovuG4uVRldLBc8zMWKYoGXDPFPUoMKhx1k-KiAZcUa6MRe7TTW5VrfabLg/exec",
            "DOB": "https://script.google.com/macros/s/AKfycbyncAUbXWLplC_uHgodCqhPCDLTWFiWEQVzxPAInLP7zedGUQRdRbvix_jdDBJrYMlc9w/exec",
            "ANNEXURE": "https://script.google.com/macros/s/AKfycbxR94qLfbW5qQFp7f9DkdcvB1aiz9wcdhZUYYgiyVSBjHVebNvVo5e95EPE7mRGH18Z/exec"
        };

        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            
            if(user && pass) {
                currentUser = user;
                document.getElementById('displayUser').innerText = user;
                document.getElementById('displayCredits').innerText = "15"; 
                
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                switchService('domicile');
            }
        }

        function handleLogout() {
            currentUser = null;
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('loginForm').reset();
        }

        function switchService(serviceName) {
            document.querySelectorAll('.service-tab').forEach(btn => {
                btn.className = "service-tab bg-white text-slate-700 border border-slate-200 py-2.5 px-4 rounded-xl font-medium text-sm text-center shadow-sm transition hover:bg-slate-50";
            });
            document.getElementById('btn-' + serviceName).className = "service-tab bg-blue-600 text-white py-2.5 px-4 rounded-xl font-medium text-sm text-center shadow-sm transition";

            const container = document.getElementById('formContainer');
            
            if(serviceName === 'domicile') {
                container.innerHTML = `
                    <h3 class="text-lg font-bold text-slate-800 mb-4">मूल निवास प्रमाण पत्र फॉर्म</h3>
                    <form onsubmit="submitForm(event, 'Domicile')" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">जिला (District)</label>
                                <select id="districtSelect" name="DISTRICT" onchange="updateTehsilsAndThanas()" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white">
                                    <option value="BAGHPAT">बागपत (Baghpat)</option>
                                    <option value="SHAMLI">शामली (Shamli)</option>
                                    <option value="MUZAFFARNAGAR">मुजफ्फरनगर (Muzaffarnagar)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">तहसील (Tehsil)</label>
                                <select id="tehsilSelect" name="TAHSEEL" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white uppercase">
                                    <!-- ऑटोमैटिक भरेगा -->
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">कस्टमर का नाम (Name)</label>
                                <input type="text" name="NAME" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">हिंदी नाम (H Name)</label>
                                <input type="text" name="HNAME" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">पिता का नाम (Father Name)</label>
                                <input type="text" name="FNAME" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">माता का नाम (Mother Name)</label>
                                <input type="text" name="MNAME" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">मकान नंबर (MN)</label>
                                <input type="text" name="MN" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">मोहल्ला / क्षेत्र (Area)</label>
                                <input type="text" name="AREA" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">ग्राम / वार्ड (Gram)</label>
                                <input type="text" name="GRAM" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">थाना (Thana)</label>
                                <select id="thanaSelect" name="THANA" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white uppercase">
                                    <!-- ऑटोमैटिक भरेगा -->
                                </select>
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">फोटो अपलोड करें (Photo)</label>
                                <input type="file" name="PHOTO" accept="image/*" required class="w-full p-2 border border-slate-300 rounded-lg text-sm bg-slate-50">
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-md transition mt-4">
                            डॉक्यूमेंट जनरेट करें (1 Credit)
                        </button>
                    </form>
                `;
                updateTehsilsAndThanas(); 
            } else if(serviceName === 'dob') {
                container.innerHTML = `
                    <h3 class="text-lg font-bold text-slate-800 mb-4">जन्म प्रमाण पत्र (DOB) फॉर्म</h3>
                    <form onsubmit="submitForm(event, 'DOB')" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">नाम (Name)</label>
                                <input type="text" name="NAME" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">लिंग (Sex)</label>
                                <select name="SEX" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white uppercase">
                                    <option value="MALE">MALE</option>
                                    <option value="FEMALE">FEMALE</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">जन्मतिथि (DOB)</label>
                                <input type="date" name="DOB" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">पिता का नाम (F Name)</label>
                                <input type="text" name="FNAME" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">माता का नाम (Mother Name)</label>
                                <input type="text" name="MNAME" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">पिन कोड (Pin)</label>
                                <input type="text" name="PIN" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">पूरा पता (Address)</label>
                                <textarea name="ADDRESS" rows="2" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase"></textarea>
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-md transition mt-4">
                            DOB सर्टिफिकेट बनाएं (1 Credit)
                        </button>
                    </form>
                `;
            } else if(serviceName === 'annexure') {
                container.innerHTML = `
                    <h3 class="text-lg font-bold text-slate-800 mb-4">Annexure 1 for Adult फॉर्म</h3>
                    <form onsubmit="submitForm(event, 'Annexure')" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">नाम (Name)</label>
                                <input type="text" name="NAME" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">पिता का नाम (Father)</label>
                                <input type="text" name="FATHER" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">आधार नंबर (Aadhaar)</label>
                                <input type="text" name="AADHAAR" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">नई जन्मतिथि (New DOB)</label>
                                <input type="date" name="NEWDOB" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">नया डॉक्यूमेंट (New Document)</label>
                                <select name="NEWDOCUMENT" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white uppercase">
                                    <option value="BIRTH CERTIFICATE">BIRTH CERTIFICATE</option>
                                    <option value="MARKSHEET">MARKSHEET</option>
                                    <option value="PASSPORT">PASSPORT</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">पुरानी जन्मतिथि (Old DOB)</label>
                                <input type="date" name="OLDDOB" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">पूरा पता (Address)</label>
                                <textarea name="ADDRESS" rows="2" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase"></textarea>
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-md transition mt-4">
                            Annexure 1 जनरेट करें (1 Credit)
                        </button>
                    </form>
                `;
            } else if(serviceName === 'history') {
                container.innerHTML = `
                    <h3 class="text-lg font-bold text-slate-800 mb-4">मेरी जनरेट की गई हिस्ट्री (History)</h3>
                    <p class="text-sm text-slate-500 mb-4">आपके द्वारा बनाए गए सभी पुराने डॉक्यूमेंट्स की सूची:</p>
                    <div class="border border-slate-200 rounded-xl overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-600 uppercase">
                                <tr>
                                    <th class="p-3">फाइल का नाम</th>
                                    <th class="p-3">तारीख और समय</th>
                                    <th class="p-3 text-right">एक्शन</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-200 text-sm text-slate-700">
                                <tr>
                                    <td class="p-3">Customer - Sample.pdf</td>
                                    <td class="p-3">21-09-2026</td>
                                    <td class="p-3 text-right"><span class="text-slate-400">उपलब्ध</span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                `;
            }
        }

        // जिले के अनुसार सही तहसीलों और थानों को लोड करने का फाइनल लॉजिक
        function updateTehsilsAndThanas() {
            const district = document.getElementById('districtSelect').value;
            const tehsilSelect = document.getElementById('tehsilSelect');
            const thanaSelect = document.getElementById('thanaSelect');
            
            tehsilSelect.innerHTML = '';
            thanaSelect.innerHTML = '';

            let tehsils = [];
            let thanas = [];

            if (district === 'BAGHPAT') {
                tehsils = ['बड़ौत', 'खेकड़ा', 'बागपत'];
                thanas = ['बड़ौत', 'खेकड़ा', 'बागपत', 'छपरोली', 'बिनौली', 'रमाला', 'दोघट', 'सिंघावली अहीर', 'बालैनी', 'चांदीनगर'];
            } else if (district === 'SHAMLI') {
                tehsils = ['KAIRANA', 'OON', 'SHAMLI'];
                thanas = ['थाना भवन', 'कैराना', 'भवन', 'झिंझाना', 'शामली', 'बाबरी', 'कांधला', 'गढ़ी पुख्ता', 'आदर्श मंडी'];
            } else if (district === 'MUZAFFARNAGAR') {
                tehsils = ['BUDHANA', 'KHATOLI', 'JANSHATH', 'MUZAFFARNAGAR'];
                thanas = ['बुढ़ाना', 'खतौली', 'जानसठ', 'मीरापुर', 'सिविल लाइन', 'कोतवाली नगर', 'नई मंडी'];
            }

            tehsils.forEach(t => {
                let opt = document.createElement('option');
                opt.value = t;
                opt.innerHTML = t;
                tehsilSelect.appendChild(opt);
            });

            thanas.forEach(th => {
                let opt = document.createElement('option');
                opt.value = th;
                opt.innerHTML = th;
                thanaSelect.appendChild(opt);
            });
        }

        function submitForm(event, serviceType) {
            event.preventDefault();
            
            const formElement = event.target;
            const formData = new FormData(formElement);
            
            formData.append('USER_ID', currentUser);
            formData.append('SERVICE_TYPE', serviceType);

            let district = formData.get('DISTRICT');
            let targetUrl = API_URLS["BAGHPAT"];

            if (serviceType === 'Domicile') {
                if (district === 'SHAMLI') targetUrl = API_URLS["SHAMLI"];
                else if (district === 'MUZAFFARNAGAR') targetUrl = API_URLS["MUZAFFARNAGAR"];
                else targetUrl = API_URLS["BAGHPAT"];
            } else if (serviceType === 'DOB') {
                targetUrl = API_URLS["DOB"];
            } else if (serviceType === 'Annexure') {
                targetUrl = API_URLS["ANNEXURE"];
            }

            const submitBtn = formElement.querySelector('button[type="submit"]');
            const originalBtnText = submitBtn.innerText;
            submitBtn.innerText = 'डॉक्यूमेंट बन रहा है, कृपया प्रतीक्षा करें...';
            submitBtn.disabled = true;

            const photoInput = formElement.querySelector('input[type="file"]');
            if (photoInput && photoInput.files[0]) {
                const reader = new FileReader();
                reader.readAsDataURL(photoInput.files[0]);
                reader.onload = function () {
                    formData.set('PHOTO', reader.result);
                    sendDataToBackend(targetUrl, formData, submitBtn, originalBtnText);
                };
            } else {
                sendDataToBackend(targetUrl, formData, submitBtn, originalBtnText);
            }
        }

        function sendDataToBackend(url, formData, submitBtn, originalBtnText) {
            if (!url) {
                alert('एरर: इस सर्विस का बैकएंड यूआरएल सेट नहीं है!');
                submitBtn.innerText = originalBtnText;
                submitBtn.disabled = false;
                return;
            }

            const dataObj = {};
            formData.forEach((value, key) => { dataObj[key] = value; });

            fetch(url, {
                method: 'POST',
                body: JSON.stringify(dataObj)
            })
            .then(response => response.json())
            .then(result => {
                submitBtn.innerText = originalBtnText;
                submitBtn.disabled = false;

                if (result.success) {
                    alert('डॉक्यूमेंट सफलतापूर्वक बन गया है!');
                    if(result.remainingCredits !== undefined) {
                        document.getElementById('displayCredits').innerText = result.remainingCredits;
                    }
                    window.open(`https://drive.google.com/file/d/${result.fileId}/view`, '_blank');
                } else {
                    alert('एरर: ' + (result.error || 'कुछ गलत हो गया है।'));
                }
            })
            .catch(error => {
                submitBtn.innerText = originalBtnText;
                submitBtn.disabled = false;
                console.error('Error:', error);
                alert('कनेक्शन में समस्या आई है। कृपया दोबारा कोशिश करें।');
            });
        }
    </script>
</body>
</html>
