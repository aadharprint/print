        // ================= STRICT AUTHENTICATION CHECK =================
        onAuthStateChanged(auth, async (user) => {
            const loadingScreen = document.getElementById('loadingScreen');
            const loginSection = document.getElementById('loginSection');
            const dashboardSection = document.getElementById('dashboardSection');

            if (user) {
                try {
                    const userDocRef = doc(db, "users", user.uid);
                    const userDoc = await getDoc(userDocRef);
                    let userCredits = 0;
                    let isVip = false;
                    if (userDoc.exists()) {
                        userCredits = userDoc.data().credits || 0;
                        isVip = userDoc.data().isVip || false;
                    }
                    
                    const isAdmin = (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase());
                    
                    window.currentUserData = { 
                        uid: user.uid, email: user.email, credits: userCredits, isVip: isVip, isAdmin: isAdmin, username: user.email.split('@')[0] 
                    };
                    
                    setupDashboard(window.currentUserData);
                    loadingScreen.style.display = 'none'; // Fixed bug here
                } catch (err) {
                    console.error(err);
                    await signOut(auth);
                }
            } else {
                // STRICT LOGOUT STATE: Shows login, hides others forcefully
                window.currentUserData = null;
                loginSection.style.display = 'flex';
                dashboardSection.style.display = 'none';
                loadingScreen.style.display = 'none'; // Fixed bug here
            }
        });

        // ================= STRICT LOGIN LOGIC =================

            const emailInput = document.getElementById('loginUsername').value.trim();
            const passInput = document.getElementById('loginPassword').value.trim();
            const errorDiv = document.getElementById('loginError');

            loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';
            loginBtn.disabled = true;

            const email = emailInput.includes('@') ? emailInput : `${emailInput.toLowerCase()}@ovportal.com`;

            try {
                await signInWithEmailAndPassword(auth, email, passInput);
                // onAuthStateChanged will handle the UI switch automatically
            } catch (error) {
                errorDiv.innerHTML = '<i class="fa-solid fa-circle-exclamation mr-1"></i> Your ID or Password are incorrect!';
                errorDiv.style.display = 'block';
                document.getElementById('loginPassword').value = '';
                loginBtn.innerHTML = originalBtnHtml;
                loginBtn.disabled = false;
            }
        };

            // ⚠️ YOUR ACTUAL UPI ID ⚠️
            const upiId = "8279650137@ptyes"; 
            const payeeName = "Ojas Print Service";
            const upiString = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(payeeName)}&am=${amount}&cu=INR`;

        window.submitPayment = async function() {
            const amount = parseFloat(document.getElementById('rupeeAmount').value);
            const utr = document.getElementById('utrNumber').value.trim();
            const creditsToAdd = amount;

            if(!utr || utr.length < 12) {
                const errorMsg = document.getElementById('paymentErrorMsg');
                errorMsg.innerText = 'Invalid UTR! Please enter a valid 12-digit UTR or Reference number.';
                errorMsg.style.display = 'block';
                return;
            }

            const btn = document.getElementById('btnSubmitPayment');
            const origHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verifying Payment...';
            btn.disabled = true;
            document.getElementById('paymentErrorMsg').style.display = 'none';

            try {
                const q = query(collection(db, "payments"), where("utrNumber", "==", utr));
                const duplicateCheck = await getDocs(q);
                if (!duplicateCheck.empty) {
                    throw new Error("This UTR has already been used! Payment verification failed.");
                }

                const userDocRef = doc(db, "users", window.currentUserData.uid);
                const newCredits = window.currentUserData.credits + creditsToAdd;
                await updateDoc(userDocRef, { credits: newCredits });
                
                await addDoc(collection(db, "payments"), {
                    userId: window.currentUserData.uid,
                    email: window.currentUserData.email,
                    amountPaid: amount,
                    creditsAdded: creditsToAdd,
                    utrNumber: utr,
                    timestamp: new Date(),
                    status: "Auto-Approved"
                });

                window.currentUserData.credits = newCredits;
                document.getElementById('displayCredits').innerText = newCredits;

                document.getElementById('walletMainUI').innerHTML = `
                    <div class="col-span-1 md:col-span-2 flex flex-col items-center justify-center p-10 bg-green-50 rounded-3xl border border-green-200 text-center animate-pulse">
                        <i class="fa-solid fa-circle-check text-6xl text-green-500 mb-4"></i>
                        <h2 class="text-3xl font-black text-green-800 tracking-tight">Payment Successful!</h2>
                        <p class="text-lg font-bold text-green-700 mt-2">${creditsToAdd} Credits have been added to your wallet.</p>
                        <button onclick="window.switchService('domicile')" class="mt-8 bg-green-600 hover:bg-green-700 text-white font-black py-4 px-8 rounded-xl shadow-glow transition transform hover:-translate-y-0.5">Go to Dashboard <i class="fa-solid fa-arrow-right ml-1"></i></button>
                    </div>
                `;
            } catch(error) {
                const errorMsg = document.getElementById('paymentErrorMsg');
                errorMsg.innerText = error.message;
                errorMsg.style.display = 'block';
            } finally {
                btn.innerHTML = origHtml;
                btn.disabled = false;
            }
        };

        async function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const MAX_WIDTH = 500; 
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6)); 
                    };
                };
            });
        }

        // ================= FORM SUBMISSION LOGIC =================
        window.submitForm = async function(event, serviceType) {
            event.preventDefault();

            if (!window.currentUserData) return alert('Please login first!');
            
            if (!window.currentUserData.isAdmin && window.currentUserData.credits < 10) {
                return alert('Insufficient credits! You need 10 credits to generate a document. Please add credits from your wallet.');
            }

            const formElement = event.target;
            const submitBtn = formElement.querySelector('button[type="submit"]');
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Processing...';
            submitBtn.disabled = true;

            const formData = new FormData(formElement);
            formData.append('USER_ID', window.currentUserData.email);
            formData.append('SERVICE_TYPE', serviceType);

            let targetUrl = "";
            if (serviceType === 'Domicile') targetUrl = API_URLS[formData.get('DISTRICT')] || API_URLS["BAGHPAT"];
            else if (serviceType === 'Caste') targetUrl = API_URLS["CASTE"];
            else if (serviceType === 'DOB') targetUrl = API_URLS["DOB"];

            try {
                if (!window.currentUserData.isAdmin) {
                    const userDocRef = doc(db, "users", window.currentUserData.uid);
                    const newCredits = window.currentUserData.credits - 10;
                    await updateDoc(userDocRef, { credits: newCredits });
                    window.currentUserData.credits = newCredits;
                    document.getElementById('displayCredits').innerText = newCredits;
                }

                const photoInput = formElement.querySelector('input[type="file"]');
                let base64Photo = "";
                if (photoInput && photoInput.files[0]) {
                    base64Photo = await compressImage(photoInput.files[0]);
                    formData.set('PHOTO', base64Photo);
                }

                const dataObj = {}; formData.forEach((v, k) => { dataObj[k] = v; });

                const response = await fetch(targetUrl, {
                    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(dataObj)
                });
                
                const result = await response.json();

                if (result.success || result.fileId) {
                    await addDoc(collection(db, "history"), {
                        userId: window.currentUserData.uid,
                        fileName: `${dataObj.NAME || 'Document'} - ${serviceType}.pdf`,
                        fileId: result.fileId || result.id || 'N/A',
                        serviceType: serviceType,
                        timestamp: new Date()
                    });
                    alert('Success! Document generated successfully.');
                    window.switchService('history');
                    formElement.reset();
                } else { throw new Error('API Response Failed'); }
            } catch (error) {
                if (!window.currentUserData.isAdmin) {
                    const userDocRef = doc(db, "users", window.currentUserData.uid);
                    const refundedCredits = window.currentUserData.credits + 10;
                    await updateDoc(userDocRef, { credits: refundedCredits });
                    window.currentUserData.credits = refundedCredits;
                    document.getElementById('displayCredits').innerText = refundedCredits;
                }
                alert('Technical error occurred. Your credits have been refunded.');
            } finally {
                submitBtn.innerHTML = originalBtnText; submitBtn.disabled = false;
            }
        };

        window.loadUserHistory = async function() {
            const historyContainer = document.getElementById('historyTableBody');
            if (!historyContainer) return;
            historyContainer.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-slate-400 font-bold"><i class="fa-solid fa-spinner fa-spin text-3xl mb-2 text-royal-500"></i><br>Loading records...</td></tr>`;

            try {
                const q = query(collection(db, "history"), where("userId", "==", window.currentUserData.uid));
                const querySnapshot = await getDocs(q);

                window.historyData = [];
                querySnapshot.forEach((docSnap) => { window.historyData.push(docSnap.data()); });
                window.historyData.sort((a, b) => b.timestamp.seconds - a.timestamp.seconds);
                window.renderHistory('ALL'); 
            } catch (err) { historyContainer.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500">Failed to load history.</td></tr>`; }
        };

        window.renderHistory = function(filterType) {
            const historyContainer = document.getElementById('historyTableBody');
            historyContainer.innerHTML = '';

            const filteredData = filterType === 'ALL' ? window.historyData : window.historyData.filter(item => item.serviceType === filterType);
            document.getElementById('userHistoryCount').innerText = `Total Files: ${filteredData.length}`;

            if (filteredData.length === 0) {
                historyContainer.innerHTML = `<tr><td colspan="4" class="p-10 text-center text-slate-400"><i class="fa-regular fa-folder-open text-5xl mb-3 text-slate-300"></i><br>No records found.</td></tr>`;
                return;
            }

            filteredData.forEach((data) => {
                const dateObj = new Date(data.timestamp.seconds * 1000);
                const dateStr = dateObj.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
                const timeStr = dateObj.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'});
                
                historyContainer.innerHTML += `
                    <tr class="border-b border-slate-100 text-sm hover:bg-slate-50 transition duration-200">
                        <td class="p-4 font-bold text-slate-800">${data.fileName}</td>
                        <td class="p-4"><span class="bg-indigo-100 text-indigo-700 border border-indigo-200 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">${data.serviceType}</span></td>
                        <td class="p-4 text-slate-500 text-xs font-medium">${dateStr} <br> ${timeStr}</td>
                        <td class="p-4 text-right whitespace-nowrap">
                            <button onclick="window.openPdfViewer('${data.fileId}', '${data.fileName}')" class="inline-flex items-center gap-1 bg-royal-50 text-royal-700 border border-royal-200 hover:bg-royal-600 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-sm">
                                <i class="fa-solid fa-eye"></i> Preview
                            </button>
                        </td>
                    </tr>
                `;
            });
        };
