        async function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const MAX_WIDTH = 500; 
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6)); 
                    };
                };
            });
        }

        window.submitForm = async function(event, serviceType) {
            event.preventDefault();

            if (!window.currentUserData) return alert('कृपया पहले लॉगिन करें!');
            if (window.currentUserData.credits <= 0) return alert('आपके पास पर्याप्त क्रेडिट्स नहीं हैं!');

            const formElement = event.target;
            const submitBtn = formElement.querySelector('button[type="submit"]');
            const originalBtnText = submitBtn.innerText;
            submitBtn.innerText = 'प्रक्रिया जारी है, कृपया प्रतीक्षा करें...';
            submitBtn.disabled = true;

            const formData = new FormData(formElement);
            formData.append('USER_ID', window.currentUserData.email);
            formData.append('SERVICE_TYPE', serviceType);

            let targetUrl = "";
            if (serviceType === 'Domicile') {
                targetUrl = API_URLS[formData.get('DISTRICT')] || API_URLS["BAGHPAT"];
            } else if (serviceType === 'Caste') targetUrl = API_URLS["CASTE"];
            else if (serviceType === 'DOB') targetUrl = API_URLS["DOB"];

            try {
                // Deduct Credit (Frontend update, Firestore rules will protect the backend)
                const userDocRef = doc(db, "users", window.currentUserData.uid);
                const newCredits = window.currentUserData.credits - 1;
                await updateDoc(userDocRef, { credits: newCredits });
                window.currentUserData.credits = newCredits;
                document.getElementById('displayCredits').innerText = newCredits;

                const photoInput = formElement.querySelector('input[type="file"]');
                let base64Photo = "";
                if (photoInput && photoInput.files[0]) {
                    base64Photo = await compressImage(photoInput.files[0]);
                    formData.set('PHOTO', base64Photo);
                }

                const dataObj = {};
                formData.forEach((value, key) => { dataObj[key] = value; });

                const response = await fetch(targetUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(dataObj)
                });
                
                const result = await response.json();

                if (result.success || result.fileId) {
                    await addDoc(collection(db, "history"), {
                        userId: window.currentUserData.uid,
                        fileName: `${dataObj.NAME || 'Document'} - ${serviceType}.pdf`,
                        fileId: result.fileId || result.id || 'N/A',
                        serviceType: serviceType,
                        timestamp: new Date()
                    });
                    alert('डॉक्यूमेंट सफलतापूर्वक बन गया है!');
                    window.switchService('history');
                } else {
                    throw new Error('API Response Failed');
                }
            } catch (error) {
                // Refund credit on error
                const userDocRef = doc(db, "users", window.currentUserData.uid);
                const refundedCredits = window.currentUserData.credits + 1;
                await updateDoc(userDocRef, { credits: refundedCredits });
                window.currentUserData.credits = refundedCredits;
                document.getElementById('displayCredits').innerText = refundedCredits;
                
                alert('तकनीकी समस्या आई है। आपका क्रेडिट वापस कर दिया गया है।');
            } finally {
                submitBtn.innerText = originalBtnText;
                submitBtn.disabled = false;
            }
        };

        window.loadUserHistory = async function() {
            const historyContainer = document.getElementById('historyTableBody');
            if (!historyContainer) return;
            historyContainer.innerHTML = `<tr><td colspan="4" class="p-4 text-center">लोड हो रहा है...</td></tr>`;

            try {
                const q = query(
                    collection(db, "history"), 
                    where("userId", "==", window.currentUserData.uid)
                );
                const querySnapshot = await getDocs(q);

                window.historyData = [];
                querySnapshot.forEach((docSnap) => {
                    window.historyData.push(docSnap.data());
                });

                // Sort: Newest First
                window.historyData.sort((a, b) => b.timestamp.seconds - a.timestamp.seconds);
                
                window.renderHistory('ALL'); 
            } catch (err) {
                historyContainer.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500">हिस्ट्री लोड करने में असफल।</td></tr>`;
            }
        };

        window.renderHistory = function(filterType) {
            const historyContainer = document.getElementById('historyTableBody');
            historyContainer.innerHTML = '';

            const filteredData = filterType === 'ALL' 
                ? window.historyData 
                : window.historyData.filter(item => item.serviceType === filterType);

            if (filteredData.length === 0) {
                historyContainer.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-500">कोई रिकॉर्ड नहीं मिला।</td></tr>`;
                return;
            }

            filteredData.forEach((data) => {
                const dateObj = new Date(data.timestamp.seconds * 1000);
                const dateStr = dateObj.toLocaleDateString('hi-IN');
                const timeStr = dateObj.toLocaleTimeString('hi-IN', { hour: '2-digit', minute: '2-digit' });
                
                historyContainer.innerHTML += `
                    <tr class="border-b text-sm text-slate-700 hover:bg-slate-50">
                        <td class="p-3 font-medium whitespace-nowrap">${data.fileName}</td>
                        <td class="p-3"><span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs font-bold">${data.serviceType}</span></td>
                        <td class="p-3 text-slate-500 text-xs whitespace-nowrap">${dateStr} <br/> ${timeStr}</td>
                        <td class="p-3 text-right whitespace-nowrap">
                            <a href="https://drive.google.com/file/d/${data.fileId}/view" target="_blank" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow">डाउनलोड</a>
                        </td>
                    </tr>
                `;
            });
        };

            else if(serviceName === 'history') {
                container.innerHTML = `
                    <div class="flex flex-col md:flex-row justify-between items-center mb-4 gap-3 border-b pb-3">
                        <h3 class="text-lg font-bold text-slate-800">मेरी हिस्ट्री</h3>
                        <div class="flex space-x-3 items-center">
                            <label class="text-sm font-semibold text-slate-600">फ़िल्टर:</label>
                            <select onchange="window.renderHistory(this.value)" class="p-2 border rounded-lg text-sm bg-white font-medium focus:ring-2 focus:ring-blue-500">
                                <option value="ALL">सभी डॉक्युमेंट्स</option>
                                <option value="Domicile">मूल निवास</option>
                                <option value="Caste">जाति प्रमाण पत्र</option>
                                <option value="DOB">जन्म प्रमाण पत्र</option>
                            </select>
                            <button onclick="window.loadUserHistory()" class="bg-slate-100 p-2 rounded-lg text-blue-600 hover:bg-slate-200"><i class="fa-solid fa-rotate-right"></i></button>
                        </div>
                    </div>
                    <div class="border rounded-xl overflow-x-auto shadow-sm">
                        <table class="w-full text-left border-collapse bg-white">
                            <thead class="bg-slate-100 border-b text-xs font-semibold text-slate-600 uppercase">
                                <tr><th class="p-3">फाइल का नाम</th><th class="p-3">प्रकार</th><th class="p-3">तारीख</th><th class="p-3 text-right">एक्शन</th></tr>
                            </thead>
                            <tbody id="historyTableBody" class="text-sm text-slate-700"></tbody>
                        </table>
                    </div>
                `;
                window.loadUserHistory();
            }
        };
    </script>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col justify-between">
    <!-- LOGIN SCREEN -->
    <div id="loginSection" class="flex items-center justify-center flex-grow p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl"><i class="fa-solid fa-print"></i></div>
                <h1 class="text-2xl font-bold text-slate-800">ओवी आधार प्रिंट सर्विस</h1>
                <p class="text-sm text-slate-500 mt-1">अपने क्रेडेंशियल्स दर्ज करें</p>
            </div>
            <form id="loginForm" onsubmit="window.handleLogin(event)" class="space-y-4">
                <input type="text" id="loginUsername" placeholder="यूजर आईडी (जैसे: rahul)" required class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-slate-50">
                <input type="password" id="loginPassword" placeholder="पासवर्ड" required class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-slate-50">
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-200 transition">लॉगिन करें <i class="fa-solid fa-arrow-right ml-2"></i></button>
            </form>
            <div id="loginError" class="mt-4 text-center text-sm font-semibold text-red-500 hidden"></div>
        </div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="dashboardSection" class="hidden flex-grow flex flex-col">
        <header class="bg-white shadow-sm border-b px-4 md:px-8 py-4 flex justify-between items-center sticky top-0 z-10">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-blue-600 text-white rounded-lg flex items-center justify-center"><i class="fa-solid fa-print"></i></div>
                <div>
                    <h2 class="text-lg md:text-xl font-bold text-slate-800">ओवी पोर्टल</h2>
                    <p class="text-xs text-slate-500 font-medium">नमस्ते, <span id="displayUser" class="text-blue-600"></span></p>
                </div>
            </div>
            <div class="flex items-center space-x-2 md:space-x-4">
                <div id="roleNavButtons" class="flex space-x-2"></div>
                <div class="bg-green-50 border border-green-200 px-3 py-1.5 md:px-4 md:py-2 rounded-xl text-sm font-bold text-green-700 shadow-sm flex items-center">
                    <i class="fa-solid fa-wallet mr-2"></i> क्रेडिट्स: <span id="displayCredits" class="ml-1 text-lg">0</span>
                </div>
                <button onclick="window.handleLogout()" class="bg-red-50 hover:bg-red-100 text-red-600 p-2 md:px-4 md:py-2 rounded-xl text-sm font-bold transition" title="लॉगआउट"><i class="fa-solid fa-right-from-bracket"></i> <span class="hidden md:inline">लॉगआउट</span></button>
            </div>
        </header>

        <main class="max-w-5xl mx-auto w-full p-4 md:p-6 flex-grow">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                <button onclick="window.switchService('domicile')" id="btn-domicile" class="service-tab bg-blue-600 text-white py-3 px-4 rounded-xl text-sm font-medium shadow-md"><i class="fa-solid fa-house-chimney mr-2"></i> मूल निवास</button>
                <button onclick="window.switchService('caste')" id="btn-caste" class="service-tab bg-white border py-3 px-4 rounded-xl text-sm font-medium"><i class="fa-solid fa-users mr-2"></i> जाति प्रमाण</button>
                <button onclick="window.switchService('dob')" id="btn-dob" class="service-tab bg-white border py-3 px-4 rounded-xl text-sm font-medium"><i class="fa-solid fa-cake-candles mr-2"></i> DOB</button>
                <button onclick="window.switchService('history')" id="btn-history" class="service-tab bg-white border py-3 px-4 rounded-xl text-sm font-medium"><i class="fa-solid fa-clock-rotate-left mr-2"></i> मेरी हिस्ट्री</button>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border p-4 md:p-6">
                <div id="formContainer"></div>
            </div>
        </main>
    </div>
    <footer class="bg-white border-t text-center py-4 text-xs text-slate-500 font-medium">© 2026 ओवी आधार प्रिंट सर्विस | सुरक्षित पोर्टल</footer>
</body>
</html>
