<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ओवी आधार प्रिंट सर्विस - पोर्टल</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBSiDAvDYyBG8hkmez7s900JHhlbenG2nU",
            authDomain: "oaps-d2cce.firebaseapp.com",
            projectId: "oaps-d2cce",
            storageBucket: "oaps-d2cce.firebasestorage.app",
            messagingSenderId: "619616461386",
            appId: "1:619616461386:web:c3b9b36815369c6f5d7cb3",
            measurementId: "G-5Y6RHLE2LK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.currentUserData = null;
        const ADMIN_EMAIL = "hkosiun1221@gmail.com"; 

        const API_URLS = {
            "BAGHPAT": "https://script.google.com/macros/s/AKfycbyA3916RXjuVRInvDPksOzbzczesTFAWo4gVzvjazGNfQl_REwC0YrYpTu03jlXwlb07w/exec",
            "SHAMLI": "https://script.google.com/macros/s/AKfycbzC1WjGvsvtXsMAhgaOtIBVLnQZ7COMaLl6-VCSvfENKtKJUJHfBYHayWr-orkGTIiQ/exec",
            "MUZAFFARNAGAR": "https://script.google.com/macros/s/AKfycby2FsD_wOd5ovuG4uVRldLBc8zMWKYoGXDPFPUoMKhx1k-KiAZcUa6MRe7TTW5VrfabLg/exec",
            "DOB": "https://script.google.com/macros/s/AKfycbyncAUbXWLplC_uHgodCqhPCDLTWFiWEQVzxPAInLP7zedGUQRdRbvix_jdDBJrYMlc9w/exec",
            "CASTE": "https://script.google.com/macros/s/AKfycbyA3916RXjuVRInvDPksOzbzczesTFAWo4gVzvjazGNfQl_REwC0YrYpTu03jlXwlb07w/exec" // डोसीमाइल जैसा बैकएंड या अलग
        };
        window.API_URLS = API_URLS;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDocRef = doc(db, "users", user.uid);
                const userDoc = await getDoc(userDocRef);
                let credits = 10;
                let isVip = false;
                if (userDoc.exists()) {
                    credits = userDoc.data().credits || 10;
                    isVip = userDoc.data().isVip || false;
                }
                window.currentUserData = { uid: user.uid, email: user.email, credits: credits, isVip: isVip, username: user.email.split('@')[0] };
                setupDashboard(window.currentUserData.username, credits, user.email, isVip);
            }
        });

        window.handleLogin = async function(event) {
            event.preventDefault();
            const emailInput = document.getElementById('loginUsername').value.trim();
            const passInput = document.getElementById('loginPassword').value.trim();
            const errorDiv = document.getElementById('loginError');
            errorDiv.classList.add('hidden');
            const email = emailInput.includes('@') ? emailInput : `${emailInput.toLowerCase()}@ovportal.com`;

            try {
                await signInWithEmailAndPassword(auth, email, passInput);
            } catch (error) {
                errorDiv.innerText = "लॉगिन असफल: गलत यूजर आईडी या पासवर्ड!";
                errorDiv.classList.remove('hidden');
            }
        };

        function setupDashboard(username, credits, email, isVip) {
            document.getElementById('displayUser').innerText = username.toUpperCase();
            document.getElementById('displayCredits').innerText = credits;

            const navContainer = document.getElementById('roleNavButtons');
            navContainer.innerHTML = '';

            if (email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                navContainer.innerHTML += `<a href="admin.html" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow transition"><i class="fa-solid fa-shield-halved mr-1"></i> एडमिन पैनल</a>`;
                navContainer.innerHTML += `<a href="vip.html" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow transition"><i class="fa-solid fa-crown mr-1"></i> VIP पोर्टल</a>`;
            } else if (isVip) {
                navContainer.innerHTML += `<a href="vip.html" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow transition"><i class="fa-solid fa-crown mr-1"></i> VIP पोर्टल</a>`;
            }

            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            window.switchService('domicile');
        }

        window.handleLogout = async function() {
            await signOut(auth);
            window.currentUserData = null;
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('loginForm').reset();
        };

        window.submitForm = async function(event, serviceType) {
            event.preventDefault();
            if (!window.currentUserData || window.currentUserData.credits <= 0) {
                alert('पर्याप्त क्रेडिट्स नहीं हैं!');
                return;
            }

            const formElement = event.target;
            const formData = new FormData(formElement);
            formData.append('USER_ID', window.currentUserData.email);
            formData.append('SERVICE_TYPE', serviceType);

            let district = formData.get('DISTRICT');
            let targetUrl = API_URLS["BAGHPAT"];
            if (serviceType === 'Domicile') {
                if (district === 'SHAMLI') targetUrl = API_URLS["SHAMLI"];
                else if (district === 'MUZAFFARNAGAR') targetUrl = API_URLS["MUZAFFARNAGAR"];
            } else if (serviceType === 'DOB') {
                targetUrl = API_URLS["DOB"];
            } else if (serviceType === 'Caste') {
                targetUrl = API_URLS["CASTE"];
            }

            const submitBtn = formElement.querySelector('button[type="submit"]');
            const originalBtnText = submitBtn.innerText;
            submitBtn.innerText = 'डॉक्यूमेंट बन रहा है...';
            submitBtn.disabled = true;

            const photoInput = formElement.querySelector('input[type="file"]');
            if (photoInput && photoInput.files[0]) {
                const reader = new FileReader();
                reader.readAsDataURL(photoInput.files[0]);
                reader.onload = function () {
                    formData.set('PHOTO', reader.result);
                    executeBackendRequest(targetUrl, formData, submitBtn, originalBtnText, serviceType);
                };
            } else {
                executeBackendRequest(targetUrl, formData, submitBtn, originalBtnText, serviceType);
            }
        };

        async function executeBackendRequest(url, formData, submitBtn, originalBtnText, serviceType) {
            const dataObj = {};
            formData.forEach((value, key) => { dataObj[key] = value; });

            try {
                const response = await fetch(url, { method: 'POST', body: JSON.stringify(dataObj) });
                const result = await response.json();

                submitBtn.innerText = originalBtnText;
                submitBtn.disabled = false;

                if (result.success) {
                    const newCredits = window.currentUserData.credits - 1;
                    await updateDoc(doc(db, "users", window.currentUserData.uid), { credits: newCredits });
                    window.currentUserData.credits = newCredits;
                    document.getElementById('displayCredits').innerText = newCredits;

                    await addDoc(collection(db, "history"), {
                        userId: window.currentUserData.uid,
                        fileName: `${dataObj.NAME || 'Document'} - ${serviceType}.pdf`,
                        fileId: result.fileId,
                        serviceType: serviceType,
                        timestamp: new Date()
                    });

                    alert('डॉक्यूमेंट सफलतापूर्वक बन गया है!');
                    window.switchService('history');
                } else {
                    alert('एरर: ' + (result.error || 'कुछ गलत हो गया।'));
                }
            } catch (error) {
                submitBtn.innerText = originalBtnText;
                submitBtn.disabled = false;
                alert('कनेक्शन में समस्या आई है।');
            }
        }

        window.loadUserHistory = async function() {
            const historyContainer = document.getElementById('historyTableBody');
            if (!historyContainer) return;
            historyContainer.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-slate-500">लोड हो रहा है...</td></tr>`;

            const q = query(collection(db, "history"), where("userId", "==", window.currentUserData.uid));
            const querySnapshot = await getDocs(q);

            historyContainer.innerHTML = '';
            if (querySnapshot.empty) {
                historyContainer.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-slate-500">कोई हिस्ट्री नहीं है।</td></tr>`;
                return;
            }

            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const dateStr = data.timestamp ? new Date(data.timestamp.seconds * 1000).toLocaleDateString('hi-IN') : 'अभी-अभी';
                historyContainer.innerHTML += `
                    <tr class="hover:bg-slate-50 transition border-b border-slate-100">
                        <td class="p-3 font-medium text-slate-800">${data.fileName}</td>
                        <td class="p-3 text-slate-500 text-xs">${dateStr}</td>
                        <td class="p-3 text-right">
                            <a href="https://drive.google.com/file/d/${data.fileId}/view" target="_blank" class="bg-green-50 text-green-700 border border-green-200 hover:bg-green-600 hover:text-white px-3 py-1.5 rounded-lg text-xs font-semibold">
                                <i class="fa-solid fa-download mr-1"></i> डाउनलोड
                            </a>
                        </td>
                    </tr>
                `;
            });
        };

            const container = document.getElementById('formContainer');
            if(serviceName === 'domicile') {
                container.innerHTML = `
                    <h3 class="text-lg font-bold text-slate-800 mb-4">मूल निवास प्रमाण पत्र फॉर्म</h3>
                    <form onsubmit="window.submitForm(event, 'Domicile')" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">जिला</label>
                                <select id="districtSelect" name="DISTRICT" onchange="window.updateTehsils()" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white">
                                    <option value="BAGHPAT">बागपत</option><option value="SHAMLI">शामली</option><option value="MUZAFFARNAGAR">मुजफ्फरनगर</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">तहसील</label>
                                <select id="tehsilSelect" name="TAHSEEL" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white uppercase"></select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">रिश्ता</label>
                                <select name="REL" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white uppercase"><option value="पुत्र / पुत्री">पुत्र / पुत्री</option><option value="पत्नी">पत्नी</option></select>
                            </div>
                            <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">नाम</label><input type="text" name="NAME" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase"></div>
                            <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">हिंदी नाम</label><input type="text" name="HNAME" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm"></div>
                            <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">पिता/पति का नाम</label><input type="text" name="FNAME" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase"></div>
                            <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">माता का नाम</label><input type="text" name="MNAME" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase"></div>
                            <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">मकान नंबर</label><input type="text" name="MN" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase"></div>
                            <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">मोहल्ला</label><input type="text" name="AREA" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase"></div>
                            <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">ग्राम / वार्ड</label><input type="text" name="GRAM" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase"></div>
                            <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">थाना</label><select id="thanaSelect" name="THANA" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white uppercase"></select></div>
                            <div class="md:col-span-2"><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">फोटो</label><input type="file" name="PHOTO" accept="image/*" required class="w-full p-2 border border-slate-300 rounded-lg text-sm bg-slate-50"></div>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-md transition mt-4">डॉक्यूमेंट जनरेट करें (1 Credit)</button>
                    </form>`;
                window.updateTehsils();
            } else if(serviceName === 'caste') {
                // जाति प्रमाण पत्र फॉर्म (बिना थाना field के)
                container.innerHTML = `
                    <h3 class="text-lg font-bold text-slate-800 mb-4">जाति प्रमाण पत्र (Caste Certificate) फॉर्म</h3>
                    <form onsubmit="window.submitForm(event, 'Caste')" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">जिला</label>
                                <select id="districtSelect" name="DISTRICT" onchange="window.updateTehsils()" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white">
                                    <option value="BAGHPAT">बागपत</option><option value="SHAMLI">शामली</option><option value="MUZAFFARNAGAR">मुजफ्फरनगर</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">तहसील</label>
                                <select id="tehsilSelect" name="TAHSEEL" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white uppercase"></select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">रिश्ता</label>
                                <select name="REL" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white uppercase"><option value="पुत्र / पुत्री">पुत्र / पुत्री</option><option value="पत्नी">पत्नी</option></select>
                            </div>
                            <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">नाम</label><input type="text" name="NAME" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase"></div>
                            <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">हिंदी नाम</label><input type="text" name="HNAME" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm"></div>
                            <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">पिता/पति का नाम</label><input type="text" name="FNAME" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase"></div>

                            <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">मकान नंबर</label><input type="text" name="MN" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase"></div>
                            <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">मोहल्ला</label><input type="text" name="AREA" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase"></div>
                            <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">ग्राम / वार्ड</label><input type="text" name="GRAM" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase"></div>
                            <!-- जाति प्रमाण पत्र में थाना (Thana) हटा दिया गया है -->
                            <div class="md:col-span-2"><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">फोटो</label><input type="file" name="PHOTO" accept="image/*" required class="w-full p-2 border border-slate-300 rounded-lg text-sm bg-slate-50"></div>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-md transition mt-4">जाति प्रमाण पत्र बनाएं (1 Credit)</button>
                    </form>`;
                window.updateTehsils();
            } else if(serviceName === 'dob') {
                container.innerHTML = `
                    <h3 class="text-lg font-bold text-slate-800 mb-4">जन्म प्रमाण पत्र (DOB) फॉर्म</h3>
                    <form onsubmit="window.submitForm(event, 'DOB')" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">नाम</label><input type="text" name="NAME" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase"></div>
                            <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">लिंग</label><select name="SEX" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white uppercase"><option value="MALE">MALE</option><option value="FEMALE">FEMALE</option></select></div>
                            <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">जन्मतिथि</label><input type="date" name="DOB" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm"></div>
                            <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">पिता का नाम</label><input type="text" name="FNAME" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase"></div>
                            <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">माता का नाम</label><input type="text" name="MNAME" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase"></div>
                            <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">पिन कोड</label><input type="text" name="PIN" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase"></div>
                            <div class="md:col-span-2"><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">पूरा पता</label><textarea name="ADDRESS" rows="2" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase"></textarea></div>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-md transition mt-4">DOB सर्टिफिकेट बनाएं (1 Credit)</button>
                    </form>`;
            } else if(serviceName === 'history') {
                container.innerHTML = `
                    <div class="flex justify-between items-center mb-4"><h3 class="text-lg font-bold text-slate-800">मेरी हिस्ट्री</h3><button onclick="window.loadUserHistory()" class="text-sm text-blue-600 font-semibold"><i class="fa-solid fa-rotate-right mr-1"></i> रिफ्रेश</button></div>
                    <div class="border border-slate-200 rounded-xl overflow-x-auto"><table class="w-full text-left bg-white"><thead class="bg-slate-100 text-xs font-semibold text-slate-600 uppercase"><tr><th class="p-3">फाइल नाम</th><th class="p-3">तारीख</th><th class="p-3 text-right">एक्शन</th></tr></thead><tbody id="historyTableBody" class="divide-y divide-slate-200 text-sm"></tbody></table></div>`;
                window.loadUserHistory();
            }
        };

        window.updateTehsils = function() {
            const district = document.getElementById('districtSelect').value;
            const tehsilSelect = document.getElementById('tehsilSelect');
            const thanaSelect = document.getElementById('thanaSelect');
            if(!tehsilSelect) return;
            tehsilSelect.innerHTML = '';
            if(thanaSelect) thanaSelect.innerHTML = '';

            let tehsils = district === 'BAGHPAT' ? ['बड़ौत', 'खेकड़ा', 'बागपत'] : district === 'SHAMLI' ? ['KAIRANA', 'OON', 'SHAMLI'] : ['BUDHANA', 'KHATOLI', 'JANSHATH', 'MUZAFFARNAGAR'];
            tehsils.forEach(t => tehsilSelect.innerHTML += `<option value="${t}">${t}</option>`);

            if(thanaSelect) {
                let thanas = district === 'BAGHPAT' ? ['बड़ौत', 'खेकड़ा', 'बागपत', 'छपरोली'] : district === 'SHAMLI' ? ['थाना भवन', 'कैराना', 'शामली'] : ['बुढ़ाना', 'खतौली'];
                thanas.forEach(th => thanaSelect.innerHTML += `<option value="${th}">${th}</option>`);
            }
        };
    </script>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex flex-col justify-between">
    <div id="loginSection" class="flex items-center justify-center flex-grow p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border">
            <div class="text-center mb-6"><h1 class="text-2xl font-bold text-slate-800">ओवी आधार प्रिंट सर्विस</h1><p class="text-sm text-slate-500 mt-1">लॉगिन करें</p></div>
            <form id="loginForm" onsubmit="window.handleLogin(event)" class="space-y-4">
                <div><label class="block text-sm font-medium text-slate-700 mb-1">यूजर आईडी / ईमेल</label><input type="text" id="loginUsername" required class="w-full px-4 py-2 border rounded-lg"></div>
                <div><label class="block text-sm font-medium text-slate-700 mb-1">पासवर्ड</label><input type="password" id="loginPassword" required class="w-full px-4 py-2 border rounded-lg"></div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg shadow">लॉगिन</button>
            </form>
            <div id="loginError" class="mt-4 text-center text-sm text-red-600 hidden"></div>
        </div>
    </div>

    <div id="dashboardSection" class="hidden flex-grow flex flex-col">
        <header class="bg-white shadow-sm border-b px-6 py-4 flex justify-between items-center">
            <div><h2 class="text-xl font-bold text-slate-800">ओवी पोर्टल डैशबोर्ड</h2><p class="text-xs text-slate-500">यूजर: <span id="displayUser" class="font-semibold text-blue-600"></span></p></div>
            <div class="flex items-center space-x-3">
                <div id="roleNavButtons" class="flex space-x-2"></div>
                <div class="bg-blue-50 border border-blue-200 px-3 py-1.5 rounded-lg text-sm font-medium text-blue-800">क्रेडिट्स: <span id="displayCredits" class="font-bold text-blue-900">0</span></div>
                <button onclick="window.handleLogout()" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg text-sm font-medium">लॉगआउट</button>
            </div>
        </header>
        <main class="max-w-4xl mx-auto w-full p-6 flex-grow">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                <button onclick="window.switchService('domicile')" id="btn-domicile" class="service-tab bg-blue-600 text-white py-2.5 px-4 rounded-xl font-medium text-sm text-center shadow-sm">मूल निवास</button>
                <button onclick="window.switchService('caste')" id="btn-caste" class="service-tab bg-white text-slate-700 border py-2.5 px-4 rounded-xl font-medium text-sm text-center">जाति प्रमाण पत्र</button>
                <button onclick="window.switchService('dob')" id="btn-dob" class="service-tab bg-white text-slate-700 border py-2.5 px-4 rounded-xl font-medium text-sm text-center">DOB सर्टिफिकेट</button>
                <button onclick="window.switchService('history')" id="btn-history" class="service-tab bg-white text-slate-700 border py-2.5 px-4 rounded-xl font-medium text-sm text-center">हिस्ट्री</button>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border p-6"><div id="formContainer"></div></div>
        </main>
    </div>
    <footer class="bg-white border-t text-center py-4 text-xs text-slate-500">© 2026 ओवी आधार प्रिंट सर्विस.</footer>
</body>
</html>
